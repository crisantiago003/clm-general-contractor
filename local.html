function renderOrders(){
  sub.type = sub.type || 'ALL';
  sub.search = sub.search || '';
  if(sub.editId !== undefined){ renderOrderDetail(sub.editId); return; }

  const foremanOnly = session.type==='Employee' && canRequestForSite();
  const mySite = foremanOnly ? foremanSite().trim().toLowerCase() : null;

  const types = [['ALL','All'],['INVOICE','Invoices'],['PURCHASE','Purchase Orders'],['WORK ORDER','Work Orders']];
  let rows = DB.orders.filter(o => sub.type==='ALL' || o.type===sub.type);
  if(foremanOnly){ rows = rows.filter(o => (o.jobName||'').trim().toLowerCase()===mySite); }
  if(sub.search){
    const q = sub.search.toLowerCase();
    rows = rows.filter(o => partyName(o).toLowerCase().includes(q) || String(o.id).includes(q) || (o.jobName||'').toLowerCase().includes(q));
  }
  rows = [...rows].sort((a,b)=> b.id - a.id);
  const pg = paginate(rows, sub.page||1);

  document.getElementById('mainArea').innerHTML = `
    <div class="crumb">Orders${foremanOnly?` — ${esc(foremanSite())}`:''}</div>
    <div class="panel">
      <div class="ph">
        <h3 style="font-size:18px">Orders</h3>
        <div style="display:flex;gap:8px;align-items:center">
          ${canEdit() ? `<button class="btn ghost sm" onclick="exportOrdersCSV()" title="Export CSV">📥 CSV</button>` : ''}
          ${canCreateForSite(foremanOnly?foremanSite():null) || canEdit() ? `<button class="btn pri" onclick="newOrder(sub.type==='ALL'?'INVOICE':sub.type)">+ New Order</button>` : ''}
        </div>
      </div>
      <div class="pillnav">${types.map(([k,l])=>`<button class="${sub.type===k?'on':''}" onclick="sub.type='${k}';sub.page=1;renderOrders()">${l}</button>`).join('')}</div>
      <div class="searchbar">
        <input id="searchOrders" placeholder="Search by order #, party, or job..." value="${esc(sub.search)}" oninput="searchInput(this,()=>{sub.search=this.value;sub.page=1;renderOrders();})">
      </div>
      <div class="twrap"><table>
        <tr><th>#</th><th>Type</th><th>Party</th><th>Job</th><th>Date</th><th>Status</th>${!foremanOnly?'<th class="right">Total</th><th class="right">Profit</th>':''}</tr>
        ${pg.items.map(o=>{
          const p = orderProfit(o);
          return `<tr class="click" onclick="go('orders',{editId:${o.id},type:sub.type})">
            <td class="mono">${o.id}</td>
            <td><span class="badge ${orderTypeClass(o.type)}">${orderTypeLabel(o.type)}</span></td>
            <td>${esc(partyName(o))}</td>
            <td class="mut">${esc(o.jobName||'—')}</td>
            <td class="mut">${fmtDate(o.date)}</td>
            <td><span class="badge b-status b-${esc(o.status)}">${esc(o.status||'—')}</span></td>
            ${!foremanOnly?`<td class="num">${money(orderTotal(o))}</td><td class="num">${p===null?'<span class="mut">—</span>':money(p)}</td>`:''}
          </tr>`;
        }).join('') || `<tr><td colspan="${foremanOnly?6:8}" class="empty">No orders found</td></tr>`}
      </table></div>
      ${paginationHtml(pg,'ordersPage')}
    </div>
  `;
}

function ordersPage(p){ sub.page=p; renderOrders(); }
function newOrder(type){
  const order = { id: nextId(DB.orders), type, partyId:'', partyName:'', jobId:'', jobName:'', date: todayISO(), status: defaultStatus(type), account: defaultAccount(type), payment:'', payments: [], items: [], laborCosts: [] };
  DB.orders.push(order);
  go('orders', {editId: order.id, isNew:true});
}
function defaultStatus(type){ return type==='INVOICE' ? 'Ordered' : type==='PURCHASE' ? 'Pending' : 'Scheduled'; }
function defaultAccount(type){ return type==='INVOICE' ? 'Invoice Sales' : type==='PURCHASE' ? 'Materials Purch' : ''; }
const ORDER_STATUSES = { 'INVOICE':['Ordered','Delivered','Paid','Closed'], 'PURCHASE':['Pending','Delivered','Paid','Closed'], 'WORK ORDER':['Scheduled','In Progress','Completed','Closed'] };
const ACCOUNTS = ['Rent','Utilities','Materials Purch','Labor Paid','Invoice Sales','Salary','Meals','Entertainment','Taxes','Auto Expenses','Appt. Rental','Freelance Work','Equipment Rental'];

function savePayment(orderId){

    method: document.getElementById('pay_method').value,
    reference: document.getElementById('pay_ref').value.trim(),
    notes: document.getElementById('pay_notes').value.trim(),
  });
  const totalWithTax = orderTotal(o) * (1 + taxRateFor(o.type));

  saveDB(); closeModal(); toast('Payment recorded'); go('orders',{editId:orderId});
}
function removePayment(orderId, paymentId){

  o.payments = o.payments.filter(p=>p.id !== paymentId);
  if(o.status === 'Paid' && orderTotalPaid(o) < orderTotal(o) * (1 + taxRateFor(o.type))) o.status = 'Sent';
  saveDB(); toast('Payment removed'); go('orders',{editId:orderId});
}
function accountsReceivable(){
  const today = todayISO();
  return DB.orders.filter(o=>o.type==='INVOICE' && !['Paid','Closed'].includes(o.status)).map(o=>{
    const total = orderTotal(o);
    const paid = orderTotalPaid(o);
    const balance = total - paid;
    const refDate = o.dueDate || o.date;
    const days = refDate ? Math.floor((new Date(today) - new Date(refDate)) / 86400000) : 0;
    const overdue = o.dueDate ? (today > o.dueDate && balance > 0) : days > 30;
    return { order: o, total, paid, balance, daysOutstanding: days, overdue };
  }).filter(r=>r.balance > 0).sort((a,b)=>b.daysOutstanding-a.daysOutstanding);
}

function openBulkImport(module, context){
  const cfg = BULK_IMPORT_CONFIG[module];
  openModal(`
    <h3>Bulk Import — ${cfg.label}</h3>
    <p style="font-size:13px;color:var(--muted)">Copy cells directly from Excel or Google Sheets and paste below — one row per line, columns separated by tabs (the normal way spreadsheet copy-paste works). No header row.</p>
    <div class="mut" style="font-size:11.5px;margin-bottom:6px">Expected columns, in order:</div>
    <div class="mono" style="font-size:11px;background:var(--input);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:10px;overflow-x:auto;white-space:nowrap">${cfg.columns.join('  |  ')}</div>
    <textarea id="bulkImportText" rows="8" placeholder="${cfg.example}" style="font-family:var(--mono);font-size:12px"></textarea>
    <div id="bulkImportPreview" class="mut" style="font-size:12px;margin-top:8px"></div>
    <div class="btnrow">
      <button class="btn save" onclick="runBulkImport('${module}'${context!=null?`,${JSON.stringify(context)}`:''})">Import</button>
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
    </div>
  `);
  document.getElementById('bulkImportText').addEventListener('input', function(){
    const lines = this.value.split('\n').map(l=>l.trim()).filter(Boolean);
    document.getElementById('bulkImportPreview').textContent = lines.length ? `${lines.length} row${lines.length===1?'':'s'} detected` : '';
  });
}
function runBulkImport(module, context){
  const cfg = BULK_IMPORT_CONFIG[module];
  const text = document.getElementById('bulkImportText').value;
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){ toast('Paste some rows first'); return; }
  let imported = 0;
  lines.forEach(line=>{
    const cells = line.split('\t').map(c=>c.trim());
    if(!cells[0]) return;
    const rec = cfg.build(cells);
    cfg.push(rec, context);
    imported++;
  });
  saveDB(); closeModal(); toast(`Imported ${imported} ${cfg.label.toLowerCase()}`);
  if(module==='materials') renderInventory();
  else if(module==='employees') go('employees');
  else if(module==='products') renderProducts();
  else if(module==='vendors') renderVendors();
  else if(module==='activities') go('customers',{custId:context});
}

      logNotification('Price Change', `${name}: purchase price ${money(existing.purchasePrice)}→${money(vals.purchasePrice)}, sales price ${money(existing.salesPrice)}→${money(vals.salesPrice)}`, 'products');

async function saveActivityLogUpdate(custId, activityId){
  const c = customerById(custId);
  if(!c || !canCreateForSite(c.name)) return;
  const a = (DB.scheduleActivities||[]).find(x=>x.id===activityId);
  if(!a) return;
  const note = document.getElementById('log_note').value.trim();
  const newStatus = document.getElementById('log_status').value;
  a.status = newStatus;
  a.actualStart = document.getElementById('log_astart').value;
  a.actualEnd = document.getElementById('log_aend').value;
  if(newStatus==='In Progress' && !a.actualStart) a.actualStart = todayISO();
  if(newStatus==='Completed' && !a.actualEnd) a.actualEnd = todayISO();
  if(newStatus==='Completed' && !a.actualStart) a.actualStart = a.plannedStart || todayISO();
  const pct = Math.round(scheduleProgressFraction(a)*100);
  if(!c.activityLog) c.activityLog = [];
  c.activityLog.push({ id: uid(), activityId, activityName: a.name, date: todayISO(), by: session.name, note, pctAfter: pct });
  c.completionPct = projectCompletionPct(c);
  logNotification('Progress Update', `${c.name} — ${a.name} updated to ${pct}%${note?': '+note:''}`, 'customers', {custId});
  const r = await saveDBAndConfirmSync();
  closeModal();
  toast(r.synced ? 'Progress logged' : `⚠️ Saved here, but failed to sync — ${r.error||'check your connection'}. Try again, or log out and back in.`);
  go('customers',{custId});
}

function parseMoney(str){
  // Real spreadsheet numbers come with thousand-separator commas and sometimes a peso sign —
  // Number() alone treats those as invalid and silently returns 0, which is exactly the bug
  // that caused a real program import to show a ₱0 total. Strip everything but digits/decimal first.
  if(typeof str === 'number') return str;
  const cleaned = String(str||'').replace(/[₱,\s]/g, '');
  const n = Number(cleaned);
  return isNaN(n) ? 0 : n;
}

function saveProgramDraft(custId){
  const draft = window.__programDraft || [];
  if(!draft.length){ toast('Add at least one item first'); return; }
  const c = customerById(custId);
  const totalBudget = draft.reduce((s,r)=>s+r.budgetAmount, 0);
  if(totalBudget <= 0){ toast('Total budget came out to ₱0 — check the amounts entered'); return; }
  if(!DB.scheduleActivities) DB.scheduleActivities = [];
  const existing = DB.scheduleActivities.filter(a=>a.projectId===custId);
  const hasExistingProgress = existing.some(a=>a.status==='In Progress'||a.status==='Completed'||a.actualStart);
  const doSave = async () => {
    DB.scheduleActivities = DB.scheduleActivities.filter(a=>a.projectId!==custId);
    draft.forEach(r=>{
      DB.scheduleActivities.push({
        id: nextId(DB.scheduleActivities),
        projectId: custId,
        name: r.name, itemNo: r.itemNo,
        cost: r.budgetAmount,
        plannedStart: '', plannedEnd: '',
        actualStart: '', actualEnd: '',
        status: 'Not Started'
      });
    });
    c.budget = totalBudget;
    c.completionPct = projectCompletionPct(c);
    window.__programDraft = null; closeModal();
    const r2 = await saveDBAndConfirmSync();
    toast(r2.synced ? `Saved ${draft.length} items — total budget ${money(totalBudget)}` : `⚠️ Saved here, but failed to sync — ${r2.error||'check your connection'}. Try again, or log out and back in.`);
    go('customers',{custId});
  };
  if(hasExistingProgress){
    window.__pendingProgramImport = doSave;
    closeModal();
    openModal(`
      <h3>⚠️ Replace Existing Activities?</h3>
      <p style="font-size:13.5px">This project already has activities with progress. Saving this program replaces the entire activity list — any progress already recorded will be lost (though it stays visible in the project's activity log history).</p>
      <div class="btnrow">
        <button class="btn del" onclick="window.__pendingProgramImport()">Replace Anyway</button>
        <button class="btn ghost" onclick="closeModal()">Cancel</button>
      </div>
    `);
  } else {
    doSave();
  }
}

function fileSizeLabel(bytes){
  if(!bytes) return '—';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(0)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}
function uploadProjectFiles(custId, fileList){
  const c = customerById(custId);
  if(!c.attachments) c.attachments = [];
  const files = [...fileList];
  const MAX_SIZE = 6 * 1024 * 1024; // 6MB soft cap per file — localStorage has limited total space
  let processed = 0;
  files.forEach(file=>{
    if(file.size > MAX_SIZE){
      toast(`"${file.name}" is too large (${fileSizeLabel(file.size)}). Keep files under 6MB.`);
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      c.attachments.push({ id: uid(), name: file.name, size: file.size, type: file.type, date: todayISO(), dataUrl: reader.result });
      processed++;
      try{
        saveDB();
      }catch(err){
        c.attachments.pop();
        toast('Storage is full — try a smaller file or remove old attachments first.');
        return;
      }
      toast(`${file.name} uploaded`);
      if(view==='customers') go('customers',{custId});
    };
    reader.readAsDataURL(file);
  });
}
function deleteProjectFile(custId, fileId){
  if(!confirm('Delete this file?')) return;
  const c = customerById(custId);
  c.attachments = (c.attachments||[]).filter(a=>a.id!==fileId);
  saveDB(); toast('File deleted'); go('customers',{custId});
}

function saveJob(id, custId){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Please add a job name before saving'); return; }
  if(DB.jobs.some(j=>j.name.toLowerCase()===name.toLowerCase() && j.id!==id)){ toast('This job name already exists. Please choose a unique job name'); return; }
  const vals = { name, address:document.getElementById('f_addr').value, city:document.getElementById('f_city').value, state:document.getElementById('f_state').value, zip:document.getElementById('f_zip').value, contactName:document.getElementById('f_contact').value, phone:document.getElementById('f_phone').value, email:document.getElementById('f_email').value };
  if(id){ Object.assign(jobById(id), vals); }
  else { DB.jobs.push({ id: nextId(DB.jobs), customerId: custId, ...vals }); }
  saveDB(); closeModal(); toast('Job saved'); go('customers',{custId});
}
function deleteJob(id, custId){
  if(!guardDelete()) return;
  if(!confirm('Delete this job?')) return;
  DB.jobs = DB.jobs.filter(j=>j.id!==id);
  saveDB(); closeModal(); toast('Job deleted'); go('customers',{custId});
}

const PCAB_CATEGORIES = ['AAAA','AAA','AA','A','B','Small A','Small B','C','D','E','Trade'];
function pcabStatus(v){
  if(!v.pcabNumber) return null;
  if(!v.pcabExpiry) return { label:'On File', cls:'b-status' };
  const today = todayISO();
  if(v.pcabExpiry < today) return { label:'Expired', cls:'b-danger' };
  const days = (new Date(v.pcabExpiry) - new Date(today)) / 86400000;
  if(days <= 30) return { label:'Expiring Soon', cls:'b-Pending' };
  return { label:'Valid', cls:'b-Paid' };
}
function renderCalculator(){

    const el = document.getElementById(id);
    return el ? el.value : (def||'');

  const setOut = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };

        </div>
        <div class="grid2">

          <div class="field"><label class="fl">Number of Units</label><input id="cc_qty" type="number" step="1" value="1" oninput="updateConcreteCalc()"></div>
        </div>
        <div class="field"><label class="fl">Mix Class</label>
          <select id="cc_mix" onchange="updateConcreteCalc()">
            ${Object.entries(CONCRETE_MIXES).map(([k,m])=>`<option value="${k}">${m.label}</option>`).join('')}
          </select>
        </div>
        <div class="grid3">
          <div class="field"><label class="fl">Cement ₱/bag</label><input id="cc_pcement" type="number" value="260" oninput="updateConcreteCalc()"></div>

    const stdLen = cnum('rc_stdlen',6) || 6;

    const numVertical = Math.floor(L/(spacing/100)) + 1;
    let totalLen = numVertical*H + hLayers*L;
    const grossArea = H*L;
    if(openings>0 && grossArea>0){

    const numBars = Math.ceil(totalLen/stdLen);

    setOut('rc_results', `

/* ================= Project Schedule (Gantt + S-Curve) ================= */
const SCHEDULE_STATUSES = ['Not Started','In Progress','Completed','Delayed'];
function scheduleStatusBadgeClass(s){
  if(s==='Completed') return 'b-Paid';
  if(s==='In Progress') return 'b-Pending';
  if(s==='Delayed') return 'b-danger';
  return 'b-status';
}
function seedScheduleActivities(projectId){
  const defs = [
    ['Mobilization/Demobilization',85000,10],
    ['Clearing & Earthworks',125000,12],
    ['Foundations',75000,14],
    ['Columns',50000,10],
    ['Beams',75000,12],
    ['Masonry Works',150000,21],
    ['Electrical Rough-ins',35000,10],
    ['Plumbing Rough-ins',65000,10],
    ['Roofing',145000,18],
    ['Plastering',95000,14],
    ['Tile Works',120000,16],
    ['Doors & Windows',80000,10],
    ['Painting',65000,12],
    ['Electrical Finishing',55000,8],
    ['Plumbing Finishing',45000,8],
    ['Landscaping & Cleanup',35000,7],
  ];
  const today = new Date();
  const projectStart = new Date(today.getFullYear(), today.getMonth()-2, 1); // started ~2 months ago
  let cursor = new Date(projectStart);
  const startId = nextId(DB.scheduleActivities);
  defs.forEach((d,i)=>{
    const [name,cost,dur] = d;
    const plannedStart = new Date(cursor);
    const plannedEnd = new Date(cursor); plannedEnd.setDate(plannedEnd.getDate()+dur-1);
    // stagger the next activity to start a few days before the current one ends (typical overlap)
    const overlap = Math.max(2, Math.round(dur*0.25));
    cursor = new Date(plannedEnd); cursor.setDate(cursor.getDate()-overlap+1);
    let actualStart='', actualEnd='', status='Not Started';
    if(plannedEnd < today){
      // activity should already be done or nearly done — mark completed, occasionally a touch delayed
      status = (i===5||i===8) ? 'Delayed' : 'Completed';
      actualStart = plannedStart.toISOString().slice(0,10);
      const slip = status==='Delayed' ? Math.round(dur*0.3) : 0;
      const ae = new Date(plannedEnd); ae.setDate(ae.getDate()+slip);
      actualEnd = (ae>today?today:ae).toISOString().slice(0,10);
    } else if(plannedStart <= today && today <= new Date(plannedEnd.getTime()+7*86400000)){
      status = 'In Progress';
      actualStart = plannedStart.toISOString().slice(0,10);
    } else {
      status = 'Not Started';
    }
    DB.scheduleActivities.push({
      id: startId+i, projectId,
      name, cost,
      plannedStart: plannedStart.toISOString().slice(0,10),
      plannedEnd: plannedEnd.toISOString().slice(0,10),
      actualStart, actualEnd, status
    });
  });
}
function scheduleDaysBetween(a,b){
  const d1 = new Date(a), d2 = new Date(b);
  if(isNaN(d1)||isNaN(d2)) return null;
  return Math.round((d2-d1)/86400000)+1; // inclusive
}
function scheduleActivityFractionAt(start,end,t,fallbackDur){
  const s = new Date(start);
  if(isNaN(s) || t < s) return 0;
  let e = new Date(end);
  if(isNaN(e)){
    e = new Date(s); e.setDate(e.getDate()+(fallbackDur||7));
  }
  if(t >= e) return 1;
  const total = e - s;
  if(total<=0) return 1;
  return (t-s)/total;
}
function scheduleProgressFraction(a){
  if(a.status==='Completed') return 1;
  if(a.status==='Not Started') return 0;
  if(!a.actualStart) return 0;
  const today = new Date();
  const plannedDur = scheduleDaysBetween(a.plannedStart,a.plannedEnd) || 7;
  return Math.min(0.97, scheduleActivityFractionAt(a.actualStart, a.actualEnd, today, plannedDur));
}
function scheduleBuildSeries(rows, minD, maxD){
  // weekly points from minD to maxD (inclusive), planned & actual cumulative % curves
  const totalCost = rows.reduce((s,a)=>s+(Number(a.cost)||0),0) || 1;
  const today = new Date();
  const points = [];
  let t = new Date(minD);
  const stepDays = Math.max(1, Math.round((maxD-minD)/(86400000*24))); // ~24 samples across range
  while(t <= maxD){
    let plannedPct = 0, actualPct = 0;
    rows.forEach(a=>{
      const w = (Number(a.cost)||0)/totalCost;
      const pDur = scheduleDaysBetween(a.plannedStart,a.plannedEnd) || 7;
      plannedPct += w * scheduleActivityFractionAt(a.plannedStart, a.plannedEnd, t, pDur);
      if(a.actualStart && t >= new Date(a.actualStart) && t <= today){
        const aDur = scheduleDaysBetween(a.actualStart, a.actualEnd) || pDur;
        let frac;
        if(a.actualEnd){ frac = scheduleActivityFractionAt(a.actualStart, a.actualEnd, t, aDur); }
        else if(a.status==='Completed'){ frac = 1; }
        else { frac = Math.min(0.97, scheduleActivityFractionAt(a.actualStart, null, t, pDur)); }
        actualPct += w*frac;
      } else if(a.actualStart && t > today){
        // no future actual data — hold flat at current progress fraction so the actual line stops at "today"
      }
    });
    points.push({ date: new Date(t), planned: plannedPct*100, actual: (t<=today? actualPct*100 : null) });
    t = new Date(t); t.setDate(t.getDate()+stepDays);
  }
  // ensure the final point lands exactly on maxD
  if(points.length && points[points.length-1].date.getTime()!==maxD.getTime()){
    let plannedPct=0, actualPct=0;
    rows.forEach(a=>{
      const w=(Number(a.cost)||0)/totalCost;
      const pDur = scheduleDaysBetween(a.plannedStart,a.plannedEnd) || 7;
      plannedPct += w*scheduleActivityFractionAt(a.plannedStart,a.plannedEnd,maxD,pDur);
      if(a.actualStart && maxD<=today){
        const aDur = scheduleDaysBetween(a.actualStart,a.actualEnd) || pDur;
        let frac;
        if(a.actualEnd) frac = scheduleActivityFractionAt(a.actualStart,a.actualEnd,maxD,aDur);
        else if(a.status==='Completed') frac = 1;
        else frac = Math.min(0.97, scheduleActivityFractionAt(a.actualStart,null,maxD,pDur));
        actualPct += w*frac;
      }
    });
    points.push({ date:new Date(maxD), planned:plannedPct*100, actual:(maxD<=today? actualPct*100 : null) });
  }
  return points;
}
function scheduleDateForPct(series, pct){
  // interpolate the date at which the planned series first reaches `pct`
  for(let i=1;i<series.length;i++){
    const p0=series[i-1], p1=series[i];
    if(p1.planned>=pct){
      if(p1.planned===p0.planned) return p1.date;
      const frac = (pct-p0.planned)/(p1.planned-p0.planned);
      return new Date(p0.date.getTime() + frac*(p1.date.getTime()-p0.date.getTime()));
    }
  }
  return series.length ? series[series.length-1].date : new Date();
}
function scheduleWeekLabel(d){ return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

  const sorted = [...rows].sort((a,b)=>(a.plannedStart||'').localeCompare(b.plannedStart||''));

  const today = new Date(); today.setHours(0,0,0,0);

    maxD = new Date(today); maxD.setDate(maxD.getDate()+14);

  const padMs = Math.max(3*86400000, (maxD-minD)*0.03);

    return series[series.length-1].planned;

  { let m = new Date(minD.getFullYear(), minD.getMonth(), 1);

function drawScheduleSCurve(series, minD, maxD, today, canvasId){
  const canvas = document.getElementById(canvasId||'scurveCanvas');
  if(!canvas) return;
  const cs = getComputedStyle(document.documentElement);
  const colorLine = (cs.getPropertyValue('--line')||'#333').trim();
  const colorMuted = (cs.getPropertyValue('--muted')||'#888').trim();
  const colorText = (cs.getPropertyValue('--text')||'#eee').trim();
  const colorPlanned = (cs.getPropertyValue('--accent2')||'#3fb6c9').trim();
  const colorGreen = (cs.getPropertyValue('--green')||'#38b775').trim();
  const colorDanger = (cs.getPropertyValue('--danger')||'#e0524f').trim();

  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = Math.max(300, rect.width), H = 320;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);

  const padL = 44, padR = 16, padT = 14, padB = 30;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  if(!series.length){
    ctx.fillStyle = colorMuted; ctx.font = '13px sans-serif'; ctx.textAlign='center';
    ctx.fillText('No activity data to chart yet', W/2, H/2);
    return;
  }
  const x0 = series[0].date.getTime(), x1 = series[series.length-1].date.getTime();
  const xr = Math.max(1, x1-x0);
  const xPix = d => padL + ((d.getTime()-x0)/xr)*plotW;
  const yPix = v => padT + plotH - (Math.max(0,Math.min(100,v))/100)*plotH;

  // grid lines at 0/25/50/75/100
  ctx.strokeStyle = colorLine; ctx.lineWidth = 1;
  ctx.fillStyle = colorMuted; ctx.font = '10.5px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle';
  [0,25,50,75,100].forEach(v=>{
    const y = yPix(v);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.globalAlpha=0.5; ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillText(v+'%', padL-6, y);
  });
  // x-axis date labels (about 6 ticks)
  ctx.textAlign='center'; ctx.textBaseline='top';
  const tickCount = Math.min(6, series.length);
  for(let i=0;i<tickCount;i++){
    const idx = Math.round(i*(series.length-1)/(tickCount-1||1));
    const p = series[idx];
    const x = xPix(p.date);
    ctx.fillText(scheduleWeekLabel(p.date), x, padT+plotH+6);
  }
  // axis lines
  ctx.strokeStyle = colorText; ctx.globalAlpha=0.4;
  ctx.beginPath(); ctx.moveTo(padL,padT); ctx.lineTo(padL,padT+plotH); ctx.lineTo(W-padR,padT+plotH); ctx.stroke();
  ctx.globalAlpha=1;

  // today vertical marker
  if(today>=series[0].date && today<=series[series.length-1].date){
    const tx = xPix(today);
    ctx.save();
    ctx.strokeStyle = colorDanger; ctx.setLineDash([4,3]); ctx.lineWidth=1.3;
    ctx.beginPath(); ctx.moveTo(tx,padT); ctx.lineTo(tx,padT+plotH); ctx.stroke();
    ctx.restore();
  }

  function drawLine(key, color){
    ctx.beginPath();
    let started = false;
    let lastPt = null;
    series.forEach(p=>{
      const v = p[key];
      if(v==null) return;
      const x = xPix(p.date), y = yPix(v);
      if(!started){ ctx.moveTo(x,y); started = true; }
      else if(lastPt){
        // smooth-ish curve using quadratic midpoint
        const mx = (lastPt.x+x)/2, my=(lastPt.y+y)/2;
        ctx.quadraticCurveTo(lastPt.x,lastPt.y, mx, my);
      }
      lastPt = {x,y};
    });
    if(lastPt) ctx.lineTo(lastPt.x,lastPt.y);
    ctx.strokeStyle = color; ctx.lineWidth = 2.4; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.stroke();
  }
  drawLine('planned', colorPlanned);
  const finalActual = [...series].reverse().find(p=>p.actual!=null);
  // color the actual line green if current actual% >= planned% at "today", else red
  const isAhead = finalActual ? finalActual.actual >= (()=>{
    for(let i=1;i<series.length;i++){ if(series[i].date>=today) return series[i-1].planned; }
    return series[series.length-1].planned;
  })() : true;
  drawLine('actual', isAhead ? colorGreen : colorDanger);

  // dots on last known points
  function dot(pt,key,color){ if(!pt) return; ctx.beginPath(); ctx.arc(xPix(pt.date), yPix(pt[key]), 3, 0, Math.PI*2); ctx.fillStyle=color; ctx.fill(); }
  dot(series[series.length-1], 'planned', colorPlanned);
  if(finalActual){ dot(finalActual, 'actual', isAhead?colorGreen:colorDanger); }
}

function laborCalc(l){
  const basicDay = (Number(l.dailyRate)||0) + (Number(l.adjustment)||0);
  const ot = basicDay * (3/8) * 1.25;
  const totalDay = basicDay + ot;
  const monthly = basicDay * 26;
  const sss = 920, philhealth = 100, pagibig = 100;
  const netDaily = (monthly - sss - philhealth - pagibig) / 26;
  return { basicDay, ot, totalDay, monthly, sss, philhealth, pagibig, netDaily };
}
function estimateTotals(est){
  const muc = (est.materials||[]).reduce((s,m)=>s+((Number(m.qty)||0)*(Number(m.unitPrice)||0)),0);
  const luc = (est.labor||[]).reduce((s,l)=>s+((Number(l.productivity)||0)>0 ? (Number(l.rate)||0)/Number(l.productivity) : 0),0);
  const euc = (est.equipment||[]).reduce((s,e)=>s+((Number(e.productivity)||0)>0 ? (Number(e.hourlyRate)||0)/Number(e.productivity) : 0),0);
  const tuc = muc+luc+euc;
  const totalCost = tuc * (Number(est.quantity)||0);
  return { muc, luc, euc, tuc, totalCost };
}

function supplierPurchaseHistory(vendorName){
  const nameL = (vendorName||'').trim().toLowerCase();
  if(!nameL) return [];
  const fromMaterials = DB.materials.filter(m=>(m.receivedFrom||'').trim().toLowerCase()===nameL)
    .map(m=>({ name:m.name, kind:'Material', qty:m.qty, unit:m.unit, date:m.date, site:m.site }));
  const fromEquipment = DB.equipment.filter(e=>(e.receivedFrom||'').trim().toLowerCase()===nameL)
    .map(e=>({ name:e.name, kind:'Equipment', qty:e.qty, unit:e.unit, date:e.date, site:e.site }));

function syncPurchaseNoteTransaction(vendorName, note){
  // Keeps a Transaction record in sync with a purchase note so it counts toward
  // that project's real expense totals — only when there's both a site and a real amount.
  const shouldHaveTxn = !!(note.site && note.amount > 0);
  const job = note.site ? DB.jobs.find(j=>j.name===note.site) : null;
  if(shouldHaveTxn && job){
    const vals = { name: `${note.description} (${vendorName})`, amount: note.amount, date: note.date,
      account: 'Materials Purch', accountType: 'Expense', jobId: job.id, jobName: job.name,
      notes: `Auto-linked from Manual Purchase Log — ${vendorName}` };
    if(note.transactionId && DB.transactions.some(t=>t.id===note.transactionId)){
      Object.assign(DB.transactions.find(t=>t.id===note.transactionId), vals);
    } else {
      const t = { id: nextId(DB.transactions), ...vals };
      DB.transactions.push(t);
      note.transactionId = t.id;
    }
  } else if(note.transactionId){
    // No longer qualifies (site or amount removed) — remove the linked transaction so nothing stale lingers
    DB.transactions = DB.transactions.filter(t=>t.id!==note.transactionId);
    note.transactionId = null;
  }
}

const TYPE_DEFAULT_PAYTYPE = {
  'Foreman':'Daily','Skilled Worker':'Daily','Mason':'Daily','Carpenter':'Daily','Steelman / Rebar Worker':'Daily',
  'Welder':'Daily','Electrician':'Daily','Plumber':'Daily','Heavy Equipment Operator':'Daily','Driver':'Daily',

function suggestPositionFromRate(isExisting){
  if(window.__positionManuallySet) return; // the person deliberately picked a position themselves — never fight that choice
  const payType = document.getElementById('f_paytype').value;
  const rate = Number(document.getElementById('f_reg').value)||0;
  const typeField = document.getElementById('f_type');
  const current = typeField.value;
  if(payType !== 'Daily') return;
  // For an EXISTING employee, only auto-set if the position is currently blank or already one of
  // these two generic labels — never overwrite a more specific role (Foreman, Electrician, etc.)
  // just because the rate matches. A brand-new employee has no existing role to protect, so we
  // can suggest freely there.
  if(isExisting && current && current !== 'Laborer' && current !== 'Skilled Worker') return;
  if(rate === 550) typeField.value = 'Laborer';
  else if(rate === 650) typeField.value = 'Skilled Worker';
}
const LICENSE_TYPES = ['','TESDA NC I','TESDA NC II','TESDA NC III','PRC License','Driver\'s License','Heavy Equipment Operator Certificate','COSH Certificate','Other'];
function employeeLicenseStatus(e){
  if(!e.licenseNumber && !e.licenseType) return null;
  if(!e.licenseExpiry) return { label:'On File', cls:'b-status' };
  const today = todayISO();
  if(e.licenseExpiry < today) return { label:'Expired', cls:'b-danger' };
  const days = (new Date(e.licenseExpiry) - new Date(today)) / 86400000;
  if(days <= 30) return { label:'Expiring Soon', cls:'b-Pending' };
  return { label:'Valid', cls:'b-Paid' };
}

function hoursBetween(from, to){
  if(!from || !to) return 0;
  const a = new Date(from), b = new Date(to);
  if(isNaN(a)||isNaN(b)) return 0;
  return Math.max(0, (b-a) / 3600000);
}

function saveEmployee(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Please add an employee name before saving'); return; }
  const rawReg = Number(document.getElementById('f_reg').value);
  const rawOt = Number(document.getElementById('f_ot').value);
  if(isNaN(rawReg) || rawReg < 0){ toast('Regular rate must be a valid positive number'); return; }
  if(isNaN(rawOt) || rawOt < 0){ toast('OT rate must be a valid positive number'); return; }
  const vals = {
    name, type: document.getElementById('f_type').value, payType: document.getElementById('f_paytype').value,
    foremanName: document.getElementById('f_foreman').value,
    regAmount: rawReg||0, otRate: rawOt||0,
    hourlyCost: Number(document.getElementById('f_hc').value)||0, phone: document.getElementById('f_phone').value,
    email: document.getElementById('f_email').value, address: document.getElementById('f_addr').value,
    city: document.getElementById('f_city').value, state: document.getElementById('f_state').value, zip: document.getElementById('f_zip').value,
    active: document.getElementById('f_active').checked, govDeductions: document.getElementById('f_govded').checked,
    tin: document.getElementById('f_tin').value, sssNo: document.getElementById('f_sss').value, philhealthNo: document.getElementById('f_philhealth').value, pagibigNo: document.getElementById('f_pagibig').value,
    licenseType: document.getElementById('f_lictype').value, licenseNumber: document.getElementById('f_licnum').value, licenseExpiry: document.getElementById('f_licexp').value,
  };
  if(id){
    const existing = employeeById(id);
    const oldRate = Number(existing.regAmount)||0;
    const newRate = vals.regAmount;
    if(newRate !== oldRate){
      if(!existing.rateHistory) existing.rateHistory = [];
      existing.rateHistory.push({ id: uid(), date: todayISO(), oldRate, newRate, changedBy: session.name });
    }
    Object.assign(existing, vals);
  }
  else { const ne = { id: nextId(DB.employees), rateHistory: [], ...vals }; DB.employees.push(ne); id = ne.id; }
  window.__pendingForeman = '';
  saveDB(); closeModal(); toast('Employee saved'); go('employees',{empId:id});
}

  logNotification('Deletion', `Employee "${e0?e0.name:id}" moved to Trash`, 'trash');

}
function thirteenthMonthPay(empId, year){
  const total = DB.paidEmployees
    .filter(pe=>pe.employeeId==empId)
    .map(pe=>({ pe, pr: DB.payrolls.find(p=>p.id===pe.payrollId) }))
    .filter(x=>x.pr && (x.pr.payDate||'').slice(0,4)===String(year))
    .reduce((s,x)=>s+(Number(x.pe.regPay)||0), 0);
  return total / 12;
}

function uploadEmployeeDocs(empId, fileList){
  const e = employeeById(empId);
  if(!e.documents) e.documents = [];
  const MAX_SIZE = 6*1024*1024;
  [...fileList].forEach(file=>{
    if(file.size > MAX_SIZE){ toast(`"${file.name}" is too large. Keep files under 6MB.`); return; }
    const reader = new FileReader();
    reader.onload = () => {
      e.documents.push({ id: uid(), name: file.name, size: file.size, date: todayISO(), dataUrl: reader.result });
      try{ saveDB(); }catch(err){ e.documents.pop(); toast('Storage is full — try a smaller file.'); return; }
      toast(`${file.name} uploaded`);
      if(view==='employees') go('employees',{empId, tab:'docs'});
    };
    reader.readAsDataURL(file);
  });
}
function deleteEmployeeDoc(empId, docId){
  if(!confirm('Delete this document?')) return;
  const e = employeeById(empId);
  e.documents = (e.documents||[]).filter(d=>d.id!==docId);

}

const VEH_TYPES = ['Pickup Truck','Dump Truck','Flatbed Truck','Box Truck','Van','Sedan','SUV','Trailer','Heavy Equipment','Other'];
const EXPENSE_TYPES = ['Repairs','Maintenance','Tires','Oil','Charging','Cleaning','Tolls','Insurance','Registration','New Purchase','Other'];
const FUEL_UNITS = ['Gallons','Liters'];
const METER_TYPES = ['Miles','Km'];
const REMINDER_FREQ = ['Daily','Weekly','Monthly','Annually'];
const REMINDER_STATUSES = ['Active','Paused','Completed','Cancelled'];
const MAINT_DUE_SOON_DAYS = 14;

function vehicleById(id){ return DB.vehicles.find(v=>v.id==id); }
function expensesForVehicle(id){ return DB.vehicleExpenses.filter(e=>e.vehicleId==id); }
function fuelForVehicle(id){ return DB.fuelLogs.filter(f=>f.vehicleId==id); }
function meterForVehicle(id){ return DB.meterLogs.filter(m=>m.vehicleId==id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')); }
function remindersForVehicle(id){ return DB.vehicleReminders.filter(r=>r.vehicleId==id); }
function vehicleTotalCost(id){
  const exp = expensesForVehicle(id).reduce((s,e)=>s+(Number(e.amount)||0),0);
  const fuel = fuelForVehicle(id).reduce((s,f)=>s+(Number(f.amount)||0),0);
  return exp + fuel;
}
function latestMeterReading(id){
  const logs = meterForVehicle(id);
  return logs.length ? logs[0] : null;
}
function fuelEconomy(id){
  // Group readings by unit type (Miles/Km), since a vehicle should log consistently in one unit.
  // For each type, use the earliest and latest reading chronologically and see if distance is positive.
  // Pick whichever type yields the largest valid distance (most reliable signal).
  const logs = DB.meterLogs.filter(m=>m.vehicleId==id && m.date && !isNaN(Number(m.reading)));
  if(logs.length < 2) return null;
  const byType = {};
  logs.forEach(l=>{ (byType[l.type] = byType[l.type] || []).push(l); });
  let best = null;
  Object.entries(byType).forEach(([type, arr])=>{
    if(arr.length < 2) return;
    const sorted = [...arr].sort((a,b)=>a.date.localeCompare(b.date) || (Number(a.reading)-Number(b.reading)));
    const first = sorted[0], last = sorted[sorted.length-1];
    const distance = (Number(last.reading)||0) - (Number(first.reading)||0);
    if(distance <= 0) return;
    if(!best || distance > best.distance) best = { type, first, last, distance };
  });
  if(!best) return null;
  const fuelQty = DB.fuelLogs.filter(f=>f.vehicleId==id && f.date>=best.first.date && f.date<=best.last.date).reduce((s,f)=>s+(Number(f.qty)||0),0);
  if(fuelQty <= 0) return null;
  const unit = DB.fuelLogs.find(f=>f.vehicleId==id && f.date>=best.first.date && f.date<=best.last.date)?.unit
            || DB.fuelLogs.find(f=>f.vehicleId==id)?.unit || 'Gallons';
  return { value: best.distance/fuelQty, distance: best.distance, fuelQty, meterType: best.type, unit };
}
function reminderStatusInfo(r){
  if(r.status==='Completed') return { label:'Completed', cls:'b-Completed' };
  if(r.status==='Cancelled') return { label:'Cancelled', cls:'b-status' };
  if(r.status==='Paused') return { label:'Paused', cls:'b-status' };
  const today = todayISO();
  if(!r.nextDate) return { label:'Active', cls:'b-status' };
  if(r.nextDate < today) return { label:'Overdue', cls:'b-danger' };
  const days = (new Date(r.nextDate) - new Date(today)) / 86400000;
  if(days <= MAINT_DUE_SOON_DAYS) return { label:'Due Soon', cls:'b-Pending' };
  return { label:'Upcoming', cls:'b-status' };
}

function fleetTotalSpend(){ return DB.vehicles.reduce((s,v)=>s+vehicleTotalCost(v.id),0); }

function saveVehicle(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Please enter a vehicle name before saving'); return; }
  const vals = {
    name, make: document.getElementById('f_make').value, model: document.getElementById('f_model').value,
    plate: document.getElementById('f_plate').value, type: document.getElementById('f_type').value,
    seats: document.getElementById('f_seats').value, assignedDriverId: document.getElementById('f_driver').value ? Number(document.getElementById('f_driver').value) : null,
    notes: document.getElementById('f_notes').value, active: document.getElementById('f_active').checked,
    serialNumber: document.getElementById('f_serial').value, engineType: document.getElementById('f_engine').value,
    engineNumber: document.getElementById('f_engineno').value, currentSite: document.getElementById('f_currentsite').value,
  };
  if(id){ Object.assign(vehicleById(id), vals); }
  else { const nv = { id: nextId(DB.vehicles), ...vals }; DB.vehicles.push(nv); id = nv.id; }
  saveDB(); closeModal(); toast('Vehicle saved'); go('fleet',{vehId:id});
}
function deleteVehicle(id){
  if(!guardDelete()) return;
  if(!confirm('Move this vehicle and all its expenses, fuel, meter, and reminder history to Trash?')) return;
  const v = DB.vehicles.find(x=>x.id==id);
  if(v) moveToTrash('vehicle', { ...v, expenses: DB.vehicleExpenses.filter(e=>e.vehicleId==id), fuelLogs: DB.fuelLogs.filter(f=>f.vehicleId==id), meterLogs: DB.meterLogs.filter(m=>m.vehicleId==id), reminders: DB.vehicleReminders.filter(r=>r.vehicleId==id) });
  DB.vehicles = DB.vehicles.filter(x=>x.id!=id);
  DB.vehicleExpenses = DB.vehicleExpenses.filter(e=>e.vehicleId!=id);
  DB.fuelLogs = DB.fuelLogs.filter(f=>f.vehicleId!=id);
  DB.meterLogs = DB.meterLogs.filter(m=>m.vehicleId!=id);
  DB.vehicleReminders = DB.vehicleReminders.filter(r=>r.vehicleId!=id);
  saveDB(); toast('Vehicle moved to Trash'); go('fleet');
}

function jobPickerOptions(selectedId){
  return `<option value="">— none —</option>` + DB.jobs.map(j=>`<option value="${j.id}" ${selectedId==j.id?'selected':''}>${esc(j.name)}</option>`).join('');
}
function jobLabelFor(rec){
  if(rec.jobId){ const j=jobById(rec.jobId); return j?j.name:rec.jobLabel||'—'; }
  return rec.jobLabel || '—';
}

/* ============================================================ MATERIALS & EQUIPMENT ============================================================ */
const MATERIAL_UNITS = ['PCS','SET','ROLL','BAG','KG','SACK','M','PACK','BOX','GAL','LTR'];
const EQUIPMENT_STATUSES = ['Working','Not Working','Under Repair','Retired'];

function normalizeForMatch(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // strip accents (ñ -> n)
    .replace(/[.,]/g, ' ') // turn punctuation into a space, not remove — "STO.NINO" shouldn't become "STONINO"
    .replace(/\s+/g, ' ')
    .trim();
}
function matchSiteToCanonical(raw, canonicalList){
  if(!raw) return null;
  const normRaw = normalizeForMatch(raw);
  for(const c of canonicalList){ if(normalizeForMatch(c) === normRaw) return c; }
  let best = null, bestLen = 0;
  for(const c of canonicalList){
    const normC = normalizeForMatch(c);
    if((normRaw.includes(normC) || normC.startsWith(normRaw)) && normC.length > bestLen){ best = c; bestLen = normC.length; }
  }
  return best;
}
function canonicalSiteList(){
  return [...DB.customers.map(c=>c.name), 'HQ'];
}
function siteSelectOptions(selected){
  return `<option value="">— select a site —</option>` + canonicalSiteList().map(s=>`<option value="${esc(s)}" ${s===selected?'selected':''}>${esc(s)}</option>`).join('');
}
function allSites(){
  const s = new Set();
  DB.materials.forEach(m=>{ if(m.site) s.add(m.site); });
  DB.equipment.forEach(e=>{ if(e.site) s.add(e.site); });
  DB.payrolls.forEach(p=>{ if(p.site) s.add(p.site); });
  DB.customers.forEach(c=>{ if(c.name) s.add(c.name); });
  return [...s].sort();
}
function siteDatalist(){
  return `<datalist id="siteList">${allSites().map(s=>`<option value="${esc(s)}">`).join('')}</datalist>`;
}
function equipmentStatusBadge(status){
  if(status==='Working') return '<span class="badge b-Paid">Working</span>';
  if(status==='Not Working') return '<span class="badge b-danger">Not Working</span>';
  if(status==='Under Repair') return '<span class="badge b-Pending">Under Repair</span>';
  if(status==='Retired') return '<span class="badge b-status">Retired</span>';
  return '<span class="mut">Unknown</span>';
}

function saveMaterialTransfer(id){
  const m = DB.materials.find(x=>x.id===id);
  if(!m) return;
  const qty = Number(document.getElementById('tr_qty').value)||0;
  const toSite = document.getElementById('tr_to').value.trim();
  const note = document.getElementById('tr_note').value.trim();
  if(qty <= 0){ toast('Enter a quantity to transfer'); return; }
  if(qty > Number(m.qty)){ toast(`Only ${m.qty} ${m.unit} available — can't transfer more than that`); return; }
  if(!toSite){ toast('Enter where this is being delivered to'); return; }
  if(toSite.trim().toLowerCase() === (m.site||'').trim().toLowerCase()){ toast('Destination is the same as the current site'); return; }

  const fromSite = m.site;
  m.qty = Math.round((Number(m.qty) - qty) * 100) / 100;

  // find an existing material record for the same item at the destination, or create one
  let dest = DB.materials.find(x=>x.name.trim().toLowerCase()===m.name.trim().toLowerCase() && (x.site||'').trim().toLowerCase()===toSite.trim().toLowerCase());
  if(dest){
    dest.qty = Math.round((Number(dest.qty) + qty) * 100) / 100;
  } else {
    dest = { id: nextId(DB.materials), name: m.name, qty, unit: m.unit, unitPrice: m.unitPrice, site: toSite, receivedFrom: `Transferred from ${fromSite||'—'}`, date: todayISO(), reorderPoint: '' };
    DB.materials.push(dest);
  }

  if(!DB.materialTransfers) DB.materialTransfers = [];
  DB.materialTransfers.push({ id: uid(), kind: 'Material', materialName: m.name, qty, unit: m.unit, fromSite, toSite, date: todayISO(), transferredBy: session.name, note });
  logNotification('Transfer', `${qty} ${m.unit} of "${m.name}" transferred from ${fromSite||'—'} to ${toSite}`, 'inventory', {itab:'materials', matSite: toSite});
  saveDB(); closeModal(); toast('Stock transferred'); renderInventory();
}

function saveMaterial(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Please enter a material name before saving'); return; }
  const vals = {
    name, qty: document.getElementById('f_qty').value===''?'':Number(document.getElementById('f_qty').value),
    unit: document.getElementById('f_unit').value, unitPrice: document.getElementById('f_price').value===''?'':Number(document.getElementById('f_price').value),
    site: document.getElementById('f_site').value, date: document.getElementById('f_date').value,
    receivedFrom: document.getElementById('f_from').value,
    reorderPoint: document.getElementById('f_reorder').value===''?'':Number(document.getElementById('f_reorder').value),
  };
  if(id){
    const existing = DB.materials.find(x=>x.id===id);
    if(existing.unitPrice !== vals.unitPrice && vals.unitPrice !== ''){
      logNotification('Price Change', `${name}: unit price ${money(existing.unitPrice)}→${money(vals.unitPrice)}`, 'inventory', {itab:'materials',matView:'summary'});
    }
    Object.assign(existing, vals);
  }
  else {
    DB.materials.push({ id: nextId(DB.materials), ...vals });
    const matchedVendor = DB.vendors.find(v=>v.name.trim().toLowerCase()===(vals.receivedFrom||'').trim().toLowerCase());
    if(matchedVendor){
      logNotification('Purchase', `Bought ${vals.qty||''} ${vals.unit||''} of "${name}" from ${matchedVendor.name}`, 'vendors');
    }
  }
  saveDB(); closeModal(); toast('Material saved'); renderInventory();
}
async function deleteMaterial(id){
  if(!guardDelete()) return;
  if(!confirm('Move this material record to Trash? You can restore it within 30 days.')) return;
  const m0 = DB.materials.find(x=>x.id===id);
  if(m0) moveToTrash('material', m0);
  DB.materials = DB.materials.filter(x=>x.id!==id);
  logNotification('Deletion', `Material "${m0?m0.name:id}" (${m0?m0.qty:''} ${m0?m0.unit:''}) moved to Trash`, 'trash');
  const r = await saveDBAndConfirmSync(); closeModal(); toast(r.synced ? 'Material moved to Trash' : `⚠️ Deleted here, but failed to sync — ${r.error||'check your connection'}`); renderInventory();
}

  if(qty > currentQty){ toast(`Only ${currentQty} available — can't transfer more than that`); return; }
  if(!toSite){ toast('Choose where this is being delivered to'); return; }
  if(toSite.trim().toLowerCase() === (e.site||'').trim().toLowerCase()){ toast('Destination is the same as the current site'); return; }

  const fromSite = e.site;
  e.qty = currentQty - qty;

  let dest = DB.equipment.find(x=>x.name.trim().toLowerCase()===e.name.trim().toLowerCase() && (x.brand||'').trim().toLowerCase()===(e.brand||'').trim().toLowerCase() && (x.site||'').trim().toLowerCase()===toSite.trim().toLowerCase());
  if(dest){
    dest.qty = (dest.qty!==''?Number(dest.qty):1) + qty;
  } else {
    dest = { id: nextId(DB.equipment), name: e.name, brand: e.brand, serial: e.serial, qty, unit: e.unit, status: e.status, site: toSite, receivedFrom: `Transferred from ${fromSite||'—'}`, date: todayISO() };
    DB.equipment.push(dest);
  }

  if(!DB.materialTransfers) DB.materialTransfers = [];
  DB.materialTransfers.push({ id: uid(), kind: 'Equipment', materialName: e.name, qty, unit: e.unit||'', fromSite, toSite, date: todayISO(), transferredBy: session.name, note });
  logNotification('Transfer', `${qty} unit(s) of "${e.name}" transferred from ${fromSite||'—'} to ${toSite}`, 'inventory', {itab:'equipment'});
  saveDB(); closeModal(); toast('Equipment transferred'); renderInventory();
}

const OT_THRESHOLD = 8; // hours/day

function paidEmpsFor(payrollId){ return DB.paidEmployees.filter(p=>p.payrollId==payrollId); }
function currentSiteFor(empId){
  const records = DB.paidEmployees
    .filter(pe=>pe.employeeId==empId)
    .map(pe=>({ pe, pr: DB.payrolls.find(p=>p.id===pe.payrollId) }))
    .filter(x=>x.pr)
    .sort((a,b)=>(b.pr.toDate||b.pr.payDate||'').localeCompare(a.pr.toDate||a.pr.payDate||''));
  return records.length ? { site: records[0].pr.site || '', date: records[0].pr.toDate || records[0].pr.payDate } : null;
}
function employeesCurrentlyAtSite(siteName){
  const key = (siteName||'').trim().toLowerCase();
  if(!key) return [];
  return DB.employees
    .map(e=>({ e, cur: currentSiteFor(e.id) }))
    .filter(x=>x.cur && x.cur.site && x.cur.site.trim().toLowerCase()===key)
    .sort((a,b)=>(b.cur.date||'').localeCompare(a.cur.date||''));
}
function materialGroups(){
  const grouped = {};
  DB.materials.forEach(m=>{
    const k = m.name.trim().toUpperCase();
    if(!grouped[k]) grouped[k] = { name: m.name.trim(), qty: 0, unit: m.unit, value: 0, reorderPoint: '' };
    grouped[k].qty += Number(m.qty)||0;
    grouped[k].value += (Number(m.qty)||0)*(Number(m.unitPrice)||0);
    if(!grouped[k].unit && m.unit) grouped[k].unit = m.unit;
    if(m.reorderPoint !== '' && m.reorderPoint != null){
      grouped[k].reorderPoint = grouped[k].reorderPoint === '' ? m.reorderPoint : Math.max(grouped[k].reorderPoint, m.reorderPoint);
    }
  });
  return Object.values(grouped);
}
function lowStockMaterials(){
  return materialGroups().filter(g => g.reorderPoint !== '' && g.qty < g.reorderPoint);
}
function materialsAtSite(siteName){
  const key = (siteName||'').trim().toLowerCase();
  const rows = DB.materials.filter(m=>(m.site||'').trim().toLowerCase()===key);
  const grouped = {};
  rows.forEach(m=>{
    const k = m.name.trim().toUpperCase();
    if(!grouped[k]) grouped[k] = { name: m.name, qty: 0, unit: m.unit, value: 0 };
    grouped[k].qty += Number(m.qty)||0;
    grouped[k].value += (Number(m.qty)||0)*(Number(m.unitPrice)||0);
    if(!grouped[k].unit && m.unit) grouped[k].unit = m.unit;
  });
  return Object.values(grouped).sort((a,b)=>a.name.localeCompare(b.name));
}
function equipmentAtSite(siteName){
  const key = (siteName||'').trim().toLowerCase();
  return DB.equipment.filter(e=>(e.site||'').trim().toLowerCase()===key).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

function generateUsername(name){

  const base = ((parts[0]?.[0]||'') + (parts[parts.length-1]||'')).toLowerCase().replace(/[^a-z0-9]/g,'') || 'user';
  let candidate = base, i = 1;
  while(DB.users.some(u=>(u.username||u.name).toLowerCase()===candidate.toLowerCase())){
    candidate = base + i; i++;
  }
  return candidate;
}
function generatePassword(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  const specials = '!@#$%&*';
  let pw = 'Clm';
  for(let i = 0; i < 6; i++) pw += chars[Math.floor(Math.random() * chars.length)];
  pw += specials[Math.floor(Math.random() * specials.length)];
  return pw;
}
function employeeHasAccount(empId){
  return DB.users.some(u=>u.matchedEmployeeId===empId);
}
async function generateAccountForEmployee(empId, role){
  const e = employeeById(empId);
  if(!e) return null;
  if(employeeHasAccount(empId)) return null;
  const username = generateUsername(e.name);
  const plainPassword = generatePassword();
  const hashedPassword = await hashPassword(plainPassword);
  const nameParts = e.name.trim().split(/\s+/);
  const newUser = {
    id: nextId(DB.users), name: e.name, username, password: hashedPassword, tempPlaintext: plainPassword, type: role || 'Employee',
    firstName: nameParts[0]||'', middleName: nameParts.length>2?nameParts.slice(1,-1).join(' '):'', lastName: nameParts[nameParts.length-1]||'',
    position: e.type, email: e.email||'', phone: e.phone||'', address: e.address||'',
    currentSite: '', foremanId: null, foremanName: e.foremanName||'', joinedDate: todayISO(),
    reviewed: true, autoMatched: true, matchedEmployeeId: empId, customTabs: [], credentialsGiven: false, authMigrated: false, authUserId: null,
  };
  DB.users.push(newUser);
  return newUser;
}

async function changeMyPassword(){
  const u = DB.users.find(x=>x.id===session.id);
  if(!u) return;
  const current = document.getElementById('pw_current').value;
  const next = document.getElementById('pw_new').value;
  const confirm2 = document.getElementById('pw_confirm').value;
  const currentHash = await hashPassword(current);
  if(String(u.password) !== currentHash){ toast('Current password is incorrect'); return; }
  if(next.length < 8){ toast('New password must be at least 8 characters'); return; }
  if(!/[A-Z]/.test(next)){ toast('Must include at least one uppercase letter'); return; }
  if(!/[0-9]/.test(next)){ toast('Must include at least one number'); return; }
  if(!/[^A-Za-z0-9]/.test(next)){ toast('Must include at least one special character'); return; }
  if(next !== confirm2){ toast("New passwords don't match"); return; }
  u.password = await hashPassword(next);
  u.tempPlaintext = '';
  u._pwChangedAt = new Date().toISOString();
  saveDB(); toast('Password updated');
  logout(true);
}
function uploadProfilePicture(fileList){
  const file = fileList[0];

  if(!file.type.startsWith('image/')){ toast('Please choose an image file'); return; }
  const MAX_SIZE = 2*1024*1024; // 2MB — keep it light since this loads on every header render
  if(file.size > MAX_SIZE){ toast('Please choose a smaller image (under 2MB)'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const u = DB.users.find(x=>x.id===session.id);
    if(!u) return;
    u.profilePicture = reader.result;
    try{ saveDB(); }catch(err){ u.profilePicture=''; toast('Storage is full — try a smaller photo.'); return; }
    toast('Profile photo updated');
    renderMyProfile();
    renderHeader();
  };
  reader.readAsDataURL(file);
}

    const c = computePay(e, 0, otHours, regHours);
    regPay = c.regPay; otPay = c.otPay;
  } else {
    regPay = Number(document.getElementById('f_flat').value)||0;
  }
  const gross = regPay + otPay;
  let deductions = 0, deductionBreakdown = null;
  if(e.govDeductions){ deductionBreakdown = govDeductionsFor(gross); deductions = deductionBreakdown.total; }
  const advCb = document.getElementById('f_deductAdvance');
  const advanceDeducted = (advCb && advCb.checked) ? outstandingAdvanceTotal(e.id) : 0;
  Object.assign(p, { regHours, otHours, regPay, otPay, grossPay: gross, govDeductions: deductions, deductionBreakdown, advanceDeducted, netPay: Math.max(0, gross - deductions - advanceDeducted) });
  saveDB(); closeModal(); toast('Pay updated'); go('payroll',{runId:p.payrollId});
}
function periodLengthDays(fromDate, toDate){
  if(!fromDate || !toDate) return 0;
  const ms = new Date(toDate) - new Date(fromDate);
  return isNaN(ms) ? 0 : Math.round(ms / 86400000) + 1;
}

function confirmQuickAddFromLastSite(runId){
  const pr = DB.payrolls.find(p=>p.id===runId);
  const checked = [...document.querySelectorAll('.quickAddCb:checked')].map(cb=>Number(cb.value));
  if(!checked.length){ toast('No employees selected'); return; }
  const fallbackDays = periodLengthDays(pr.fromDate, pr.toDate);
  checked.forEach(empId=>{
    const e = employeeById(empId);
    if(!e) return;
    const { reg, ot } = calcHoursForEmployee(e.id, pr.fromDate, pr.toDate);
    const daysFromTimesheet = daysWorkedFor(e.id, pr.fromDate, pr.toDate);
    let regHours=0, otHours=0, regPay=0, otPay=0;
    if(e.payType==='Hourly'){
      regHours = reg; otHours = ot;
      const c = computePay(e, reg, ot, 0);
      regPay = c.regPay; otPay = c.otPay;
    } else if(e.payType==='Daily'){
      regHours = daysFromTimesheet > 0 ? daysFromTimesheet : fallbackDays;
      const c = computePay(e, 0, 0, regHours);
      regPay = c.regPay;
    } else {
      regPay = Number(e.regAmount)||0;
    }
    const gross = regPay + otPay;
    let deductions = 0, deductionBreakdown = null;
    if(e.govDeductions){ deductionBreakdown = govDeductionsFor(gross); deductions = deductionBreakdown.total; }
    DB.paidEmployees.push({
      id: uid(), payrollId: pr.id, employeeId: e.id, employeeName: e.name, payType: e.payType,
      regHours, otHours, regPay, otPay, grossPay: gross, govDeductions: deductions, deductionBreakdown,
      advanceDeducted: 0, netPay: Math.max(0, gross - deductions),
    });
  });
  saveDB(); closeModal(); toast(`Added ${checked.length} employee${checked.length===1?'':'s'}`); go('payroll',{runId});
}

  if(!s) return true; // empty is fine, just not a malformed one

  if(!m) return false;
  const year = Number(m[1]);
  return year >= 2000 && year <= 2100;
}

function calcHoursForEmployee(empId, fromDate, toDate){
  const entries = DB.timesheets.filter(t => t.employeeId==empId && (!fromDate || t.date>=fromDate) && (!toDate || t.date<=toDate));
  let reg=0, ot=0;
  entries.forEach(t=>{
    const h = hoursBetween(t.from, t.to);
    reg += Math.min(h, OT_THRESHOLD);
    ot += Math.max(0, h - OT_THRESHOLD);
  });
  return { reg, ot };
}
function daysWorkedFor(empId, fromDate, toDate){
  const dates = new Set(DB.timesheets.filter(t => t.employeeId==empId && (!fromDate || t.date>=fromDate) && (!toDate || t.date<=toDate)).map(t=>t.date));
  return dates.size;
}
function computePay(e, reg, ot, days){
  let regPay, otPay = 0;
  if(e.payType === 'Hourly'){
    regPay = reg * (Number(e.regAmount)||0);
    otPay = ot * (Number(e.otRate)||0);
  } else if(e.payType === 'Daily'){
    regPay = (Number(days)||0) * (Number(e.regAmount)||0);
    otPay = (Number(ot)||0) * ((Number(e.regAmount)||0) / 8); // matches the real payroll sheet: OT = (Rate/8) * OT hours
  } else if(e.payType === 'Salary'){
    regPay = Number(e.regAmount)||0;
  } else { // Freelance / Piece Work — flat rate entry
    regPay = Number(e.regAmount)||0;
  }
  const gross = regPay + otPay;
  return { regPay, otPay, gross };
}
// Approximate 2026 government-mandated contributions (employee share only), per pay period.
// These are simplified estimates for budgeting purposes — verify exact figures against the
// official SSS/PhilHealth/Pag-IBIG contribution tables before using for statutory remittance.
function govDeductionsFor(grossPay){
  const sss = Math.min(grossPay, 30000) * 0.045;                          // SSS employee share ~4.5%, MSC ceiling ₱30,000
  const philhealth = Math.min(Math.max(grossPay, 10000), 100000) * 0.025; // PhilHealth 2.5% employee share, floor/ceiling
  const pagibigRate = grossPay <= 1500 ? 0.01 : 0.02;
  const pagibig = Math.min(grossPay, 5000) * pagibigRate;                 // Pag-IBIG employee share, capped base ₱5,000
  return { sss, philhealth, pagibig, total: sss + philhealth + pagibig };
}

const PESO_DENOMINATIONS = [1000, 500, 200, 100, 50, 20, 10, 5, 1];
function denominationBreakdown(amount){
  // Cash has to be handed over in whole pesos, so round first — the greedy largest-first approach
  // matches how anyone counting out real bills and coins would naturally do it.
  let remaining = Math.round(Number(amount)||0);
  const breakdown = {};
  PESO_DENOMINATIONS.forEach(d=>{
    const count = Math.floor(remaining / d);
    if(count > 0){ breakdown[d] = count; remaining -= count * d; }
  });
  return breakdown;
}
function openDenominationBreakdown(runId){

  const totals = {};
  let grandTotal = 0;
  rows.forEach(r=>{
    grandTotal += Math.round(Number(r.amount)||0);
    PESO_DENOMINATIONS.forEach(d=>{ totals[d] = (totals[d]||0) + (r.breakdown[d]||0); });

      ${rows.map(r=>`
        <tr>
          <td>${esc(r.name)}</td>
          ${PESO_DENOMINATIONS.map(d=>`<td class="num mono">${r.breakdown[d]||''}</td>`).join('')}
          <td class="num mono"><b>${money0(Math.round(r.amount))}</b></td>

    if(advCb && advCb.checked){ net -= outstandingAdvanceTotal(empId); }
    document.getElementById('reviewTotal').innerHTML = `<span>Total Pay</span><span class="mono">${money(net)}</span>`;
  };
  ['f_reg','f_ot','f_days','f_flat','f_deductAdvance'].forEach(id=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', recalc); });

}
function confirmAddToPayroll(runId, empId){
  const e = employeeById(empId);
  let regHours=0, otHours=0, regPay=0, otPay=0;
  if(e.payType==='Hourly'){
    regHours = Number(document.getElementById('f_reg').value)||0;
    otHours = Number(document.getElementById('f_ot').value)||0;
    const p = computePay(e, regHours, otHours, 0);
    regPay = p.regPay; otPay = p.otPay;
  } else if(e.payType==='Daily'){
    regHours = Number(document.getElementById('f_days').value)||0; // days worked, stored in regHours for this row
    otHours = Number(document.getElementById('f_ot').value)||0;
    const p = computePay(e, 0, otHours, regHours);
    regPay = p.regPay; otPay = p.otPay;
  } else {
    regPay = Number(document.getElementById('f_flat').value)||0;
  }
  const gross = regPay + otPay;
  let deductions = 0, deductionBreakdown = null;
  if(e.govDeductions){
    deductionBreakdown = govDeductionsFor(gross);
    deductions = deductionBreakdown.total;
  }
  const advCb = document.getElementById('f_deductAdvance');
  let advanceDeducted = 0;
  const deductAdvance = advCb && advCb.checked;
  if(deductAdvance){
    advanceDeducted = outstandingAdvanceTotal(empId);
    DB.cashAdvances.forEach(a=>{ if(a.employeeId==empId && a.status==='Outstanding'){ a.status='Deducted'; } });
  }
  DB.paidEmployees.push({
    id: uid(), payrollId: runId, employeeId: empId, employeeName: e.name, payType: e.payType,
    regHours, otHours, regPay, otPay, grossPay: gross, govDeductions: deductions, deductionBreakdown,
    advanceDeducted, netPay: Math.max(0, gross - deductions - advanceDeducted),
  });
  saveDB(); closeModal(); toast('Employee added to payroll'); go('payroll',{runId});
}

  DB.paidEmployees = DB.paidEmployees.filter(p=>p.id!==paidId);

}

async function saveUser(id){
  if(session.type !== 'Admin'){ toast('Only an Admin can edit user accounts.'); return; }
  const name = document.getElementById('f_name').value.trim();
  const username = document.getElementById('f_username').value.trim();
  const pw = document.getElementById('f_pw').value;
  if(!name || !username || (!id && !pw)){ toast('Please add a full name, username, and password before saving'); return; }
  if(DB.users.some(u=>u.id!==id && (u.username||u.name).toLowerCase()===username.toLowerCase())){ toast(`Username "${username}" is already taken`); return; }
  const type = document.getElementById('f_type').value;
  const position = document.getElementById('f_position').value;
  const canRequestForSite = document.getElementById('f_canrequest').checked;
  const customTabs = [...document.querySelectorAll('.customTabChk:checked')].map(c=>c.value);
  const vals = { name, username, type, position, canRequestForSite, customTabs, reviewed: true, credentialsGiven: true };
  if(pw){
    vals.password = await hashPassword(pw); vals.tempPlaintext = ''; // Admin just set a real password directly — no plaintext needed
    // Mark for re-migration so their next login (with this new password) re-establishes their real
    // backend account. Note: if they'd already fully migrated before this reset, the real backend
    // account still has their OLD password underneath — re-signup will fail silently in that specific
    // case, and their writes fall back to local-only until they set their own new password themselves
    // (which fully re-syncs it, see changeMyPassword). This only affects someone who both migrated
    // AND had an Admin reset afterward — a narrow case, not the common one.
    if(id){ const existing = DB.users.find(x=>x.id===id); if(existing) existing.authMigrated = false; }
  }
  if(id){ Object.assign(DB.users.find(x=>x.id===id), vals); }
  else { DB.users.push({ id: nextId(DB.users), ...vals }); }
  saveDB(); closeModal(); toast('User saved'); renderUsers();
}
async function deleteUser(id){
  if(!guardDelete()) return;
  if(DB.users.length <= 1){ toast('You must keep at least one user'); return; }
  const u0 = DB.users.find(x=>x.id==id);
  if(!u0){ toast('User not found'); return; }
  if(u0.username === session.username){ toast('You cannot delete your own account'); return; }
  if(!confirm(`Move "${u0.name}" to Trash? You can restore it within 30 days.`)) return;
  moveToTrash('user', u0);
  DB.users = DB.users.filter(u=>u.id!=id);
  logNotification('Deletion', `User account "${u0.name}" moved to Trash`, 'trash');
  const r = await saveDBAndConfirmSync(); closeModal(); toast(r.synced ? 'User moved to Trash' : `⚠️ Deleted here, but failed to sync — ${r.error||'check your connection'}`); renderUsers();
}

const MIGRATION_V3_KEY = 'buildsuite_migration_v3';
function runMigrationV3(){
  // Merge the "Veterinary" project name into "VET" so it matches the site name used everywhere else.
  if(localStorage.getItem(MIGRATION_V3_KEY)) return;
  const vetCustomer = DB.customers.find(c=>(c.name||'').trim().toUpperCase()==='VET');
  const vetVariant = DB.customers.find(c=>(c.name||'').trim().toLowerCase()==='veterinary');
  if(vetVariant && vetCustomer && vetVariant.id !== vetCustomer.id){
    // Both exist — merge the "Veterinary" one into "VET": repoint jobs/orders, then drop the duplicate.
    DB.jobs.forEach(j=>{ if(j.customerId===vetVariant.id) j.customerId = vetCustomer.id; });
    DB.orders.forEach(o=>{ if(o.partyId===vetVariant.id) o.partyId = vetCustomer.id; });
    DB.customers = DB.customers.filter(c=>c.id!==vetVariant.id);
  } else if(vetVariant){
    vetVariant.name = 'VET';
  }
  DB.jobs.forEach(j=>{ if((j.name||'').trim().toLowerCase()==='veterinary') j.name = 'VET'; });
  localStorage.setItem(MIGRATION_V3_KEY, '1');
  saveDB();
}

  // and never uses a fixed/shared password. If there's truly no Admin at all (e.g. a corrupted

  const hasAnyAdmin = DB.users.some(u=>u.type==='Admin');

  // than silently creating one here with a password nobody chose.
}

const MIGRATION_V28_KEY = 'buildsuite_migration_v28';
function runMigrationV28(){
  if(localStorage.getItem(MIGRATION_V28_KEY)) return;
  const canonical = canonicalSiteList();
  let fixed = 0;
  const unmatched = new Set();
  const normalizeField = (rec, field) => {
    if(!rec[field]) return;
    if(canonical.some(c=>c===rec[field])) return; // already exactly correct, nothing to do
    const match = matchSiteToCanonical(rec[field], canonical);
    if(match && match !== rec[field]){ rec[field] = match; fixed++; }
    else if(!match){ unmatched.add(rec[field]); }
  };
  DB.materials.forEach(m=>normalizeField(m,'site'));
  DB.equipment.forEach(e=>normalizeField(e,'site'));
  DB.payrolls.forEach(p=>normalizeField(p,'site'));
  DB.vehicles.forEach(v=>normalizeField(v,'currentSite'));
  if(fixed > 0){
    logNotification('Cleanup', `Cleaned up ${fixed} inconsistent site name${fixed===1?'':'s'} (e.g. "BINANGONAN" / "Binangonan" merged to one correct name)`, null);
  }
  if(unmatched.size){
    console.warn('Some site values could not be confidently matched to a real project and were left as-is:', [...unmatched]);
  }
  localStorage.setItem(MIGRATION_V28_KEY, '1');
  saveDB();
}

const MIGRATION_V30_KEY = 'buildsuite_migration_v30';
function runMigrationV30(){
  if(localStorage.getItem(MIGRATION_V30_KEY)) return;
  let fixed = 0;
  const repairDate = (s) => {
    if(!s) return s;
    const m = /^(\d{4,})-(\d{2})-(\d{2})$/.exec(s);
    if(!m) return s;
    const year = Number(m[1]);
    if(year >= 2000 && year <= 2100) return s; // already fine
    // e.g. "12026" — a stray leading digit before a real "2026"; take the last 4 digits
    const lastFour = Number(m[1].slice(-4));
    if(m[1].length > 4 && lastFour >= 2000 && lastFour <= 2100){
      fixed++;
      return `${lastFour}-${m[2]}-${m[3]}`;
    }
    return s; // don't guess if it doesn't look confidently fixable
  };
  DB.payrolls.forEach(pr=>{
    pr.fromDate = repairDate(pr.fromDate);
    pr.toDate = repairDate(pr.toDate);
    pr.payDate = repairDate(pr.payDate);
  });
  if(fixed > 0) logNotification('Cleanup', `Corrected ${fixed} payroll date${fixed===1?'':'s'} with an invalid year`, null);
  localStorage.setItem(MIGRATION_V30_KEY, '1');
  saveDB();
}

  DB.orders.forEach(o=>{
    if(!o.payments) o.payments = [];
  });
  localStorage.setItem(MIGRATION_V34_KEY, '1');
  saveDB();
}

/* ---------- browser notifications (client-side, requires the app tab to be open/running) ---------- */
let notifyCheckTimer = null;
function browserNotificationsEnabled(){ return localStorage.getItem('buildsuite_notify_enabled') === '1'; }
async function enableBrowserNotifications(){
  if(!('Notification' in window)){ toast('Your browser doesn\'t support notifications.'); return; }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ toast('Notifications blocked — you can allow them in your browser settings.'); return; }
  localStorage.setItem('buildsuite_notify_enabled', '1');
  toast('Notifications enabled');
  startNotifyChecks();
  if(typeof openSettings === 'function' && document.querySelector('.modal-bg')) openSettings();
}
function disableBrowserNotifications(){
  localStorage.setItem('buildsuite_notify_enabled', '0');
  stopNotifyChecks();
  toast('Notifications turned off');
  if(document.querySelector('.modal-bg')) openSettings();
}
function startNotifyChecks(){
  if(notifyCheckTimer) clearInterval(notifyCheckTimer);
  if(!browserNotificationsEnabled() || !session) return;
  checkForNewAlerts(); // check once immediately, then on an interval
  notifyCheckTimer = setInterval(checkForNewAlerts, 45000);
}
function stopNotifyChecks(){
  if(notifyCheckTimer) clearInterval(notifyCheckTimer);
  notifyCheckTimer = null;
}
function checkForNewAlerts(){
  if(!browserNotificationsEnabled() || !session || Notification.permission !== 'granted') return;
  let seen;
  try{ seen = JSON.parse(localStorage.getItem('buildsuite_notified_alerts')||'[]'); }catch(e){ seen = []; }
  const current = getAlerts();
  const currentLabels = current.map(a=>a.label);
  const freshOnes = current.filter(a=>!seen.includes(a.label));
  freshOnes.slice(0,5).forEach(a=>{ // cap at 5 per check so a bad backlog doesn't spam a wall of popups
    try{ new Notification('BuildSuite — ' + a.type, { body: a.label, tag: a.label }); }catch(e){}
  });
  localStorage.setItem('buildsuite_notified_alerts', JSON.stringify(currentLabels));
}
function dbFingerprint(){
  let h = '';
  Object.keys(DB).sort().forEach(k => {
    const v = DB[k];
    if(Array.isArray(v)){
      const maxTs = v.reduce((m,r) => Math.max(m, r&&r._ts||0), 0);
      h += k + ':' + v.length + ':' + v.reduce((s,r) => s + (r&&r._ts||0), 0) + ':' + maxTs + ';';
    } else if(v && typeof v === 'object'){
      h += k + ':' + Object.keys(v).sort().join(',') + ':' + JSON.stringify(v).length + ';';
    }
  });
  return h;
}

    try{
      const s = JSON.parse(savedSession);
      const liveUser = DB.users.find(u=>u.id===s.id);
      if(liveUser){ session = { id: liveUser.id, name: liveUser.name, type: liveUser.type }; }
    }catch(e){}
  }
  if(DB.users.length === 0){
    renderFirstTimeSetup();
    return;
  }
  if(session){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appRoot').style.display = 'flex';
    history.replaceState({ view: 'dashboard', sub: {} }, '', '');
    if(session.type === 'Pending'){ renderPendingScreen(); }
    else { go('dashboard'); }
    startInactivityWatch();
    startNotifyChecks();
    showBackupReminder();
  } else {
    renderLanding();
  }
  const loader = document.getElementById('appLoading');
  if(loader) loader.classList.add('hide');
  setTimeout(()=>{ if(loader) loader.remove(); }, 400);
}
function initTableScrollHints(){
  document.querySelectorAll('.twrap').forEach(tw=>{
    if(tw.scrollWidth > tw.clientWidth + 2) tw.classList.add('scrollable');
    else tw.classList.remove('scrollable');
  });
}
new MutationObserver(()=>setTimeout(initTableScrollHints, 100)).observe(document.getElementById('mainArea')||document.body, {childList:true,subtree:true});
document.addEventListener('visibilitychange', () => {});
document.addEventListener('click', () => { document.querySelectorAll('.nav-group.open').forEach(g => g.classList.remove('open')); });
/* ---------- offline detection ---------- */
function updateOfflineStatus(){
  const banner = document.getElementById('offlineBanner');
  if(banner) banner.classList.toggle('visible', !navigator.onLine);
}
window.addEventListener('online', ()=>{ updateOfflineStatus(); });
window.addEventListener('offline', updateOfflineStatus);
window.addEventListener('error', e => {
  console.error('Uncaught error:', e.error);
  if(typeof toastError === 'function') toastError('Something went wrong. Try refreshing.');
});
window.addEventListener('unhandledrejection', e => {
  console.error('Unhandled promise rejection:', e.reason);
});
document.addEventListener('DOMContentLoaded', ()=>{
  updateOfflineStatus();
  const safetyTimer = setTimeout(()=>{
    const loader = document.getElementById('appLoading');
    if(loader){ loader.classList.add('hide'); setTimeout(()=>{ if(loader) loader.remove(); }, 400); }
  }, 15000);
  boot().catch(e=>{ console.error('Boot failed:', e); renderLanding(); }).finally(()=>{
    clearTimeout(safetyTimer);
    const loader = document.getElementById('appLoading');
    if(loader){ loader.classList.add('hide'); setTimeout(()=>{ if(loader) loader.remove(); }, 400); }
  });
});
