<style>
:root{
  --bg:#0f1117; --panel:#181b23; --panel2:#1e222c; --line:#272d3a; --text:#e8ecf1; --muted:#7c8699;
  --accent:#f0a537; --accent-ink:#1c1204; --accent2:#38c5db; --green:#34d399; --danger:#f06360;
  --chip:#1f2430; --input:#141720; --surface:#1a1e28; --warn:#f0a537; --r:12px; --shadow:0 8px 32px rgba(0,0,0,.45);
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --glow-accent:rgba(240,165,55,.06); --glow-green:rgba(52,211,153,.06); --glow-danger:rgba(240,99,96,.06); --glow-cyan:rgba(56,197,219,.06);
  --sidebar-w:250px; --sidebar-collapsed-w:68px;
}
[data-theme="light"]{
  --bg:#f4f2ed; --panel:#ffffff; --panel2:#f8f6f0; --line:#e2ddd0; --text:#1e1c18; --muted:#6b6354;
  --accent:#c97a1f; --accent-ink:#fff8ee; --accent2:#0f7f92; --green:#1e8a52; --danger:#c1403c;
  --chip:#ede8db; --input:#fffdf9; --surface:#f7f4ec; --warn:#b06e15; --shadow:0 8px 24px rgba(60,50,20,.12);
  --glow-accent:rgba(201,122,31,.06); --glow-green:rgba(30,138,82,.06); --glow-danger:rgba(193,64,60,.06); --glow-cyan:rgba(15,127,146,.06);
  --sidebar-w:250px; --sidebar-collapsed-w:68px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* Scrollbars styled to match the active theme instead of the browser's default light scrollbar */
*{scrollbar-width:thin;scrollbar-color:var(--line) var(--panel)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--panel)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--panel)}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;background:var(--input);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,169,59,.2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important;scroll-behavior:auto!important}}
.skip-link{position:absolute;top:-40px;left:0;background:var(--accent);color:var(--accent-ink);padding:8px 16px;z-index:999;font-weight:700;font-size:13px;border-radius:0 0 8px 0;transition:top .15s}
.skip-link:focus{top:0}
.app-loading{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200;transition:opacity .3s}
.app-loading.hide{opacity:0;pointer-events:none}
.app-loading .spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.theme-transition,.theme-transition *,.theme-transition *::before,.theme-transition *::after{transition:background .3s,color .3s,border-color .3s,box-shadow .3s!important}
@media(max-width:768px){
  .hero-cards{grid-template-columns:1fr}
  .kpi-hero .v{font-size:24px}
  .modal{padding:16px;margin:8px;border-radius:10px;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
  .modal-bg{padding:8px}
  .modal.wide{max-width:100%}
}
input[type="checkbox"]{width:auto}
.pwwrap{position:relative}
.pwwrap input{padding-right:40px}
.pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:15px;padding:4px 6px;cursor:pointer;line-height:1}
.pwtoggle:hover{color:var(--text)}
label.fl{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 5px;font-weight:600}
.field{margin-bottom:12px}
h1,h2,h3,h4{margin:0;font-weight:700}
a{color:var(--accent2);cursor:pointer}

/* ===== App Layout (Sidebar + Main) ===== */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:30;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;transition:width .28s cubic-bezier(.4,0,.2,1),transform .25s ease}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;white-space:nowrap;cursor:pointer;border-bottom:1px solid var(--line);flex-shrink:0}
.sidebar .brand .mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;letter-spacing:-.02em;flex-shrink:0}
.sidebar .brand .name{font-size:14px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.sidebar .brand .name span{color:var(--accent)}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.sidebar-section{padding:0 12px;margin-bottom:4px}
.sidebar-section-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:12px 8px 6px;user-select:none}
.sidebar-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 0;border-radius:8px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all .18s ease;border:none;background:none;width:100%;text-align:left;position:relative;white-space:nowrap}
.sidebar-item:hover{background:var(--chip);transform:translateX(2px)}
.sidebar-item.on{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 80%,var(--accent2)));color:var(--accent-ink);box-shadow:0 2px 8px rgba(240,165,55,.2)}
.sidebar-item.on::before{content:'';position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-ink)}
.sidebar-item .icon{width:20px;text-align:center;font-size:15px;flex-shrink:0;line-height:1}
.sidebar-bottom{padding:12px;border-top:1px solid var(--line);flex-shrink:0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:background .15s}
.sidebar-user:hover{background:var(--chip)}
.sidebar-user .av{width:28px;height:28px;border-radius:50%;background:var(--accent2);color:#04222a;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.sidebar-user .uinfo{flex:1;min-width:0}
.sidebar-user .uname{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.sidebar-user .urole{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.sidebar-logout{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-top:6px;border-radius:8px;background:none;border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.sidebar-logout:hover{background:rgba(224,82,79,.08);color:var(--danger);border-color:var(--danger)}
.app-main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left .28s cubic-bezier(.4,0,.2,1)}
.sidebar.collapsed{width:var(--sidebar-collapsed-w)}
.sidebar.collapsed~.app-main{margin-left:var(--sidebar-collapsed-w)}
.sidebar-item .label{transition:opacity .2s,width .2s;overflow:hidden}
.sidebar.collapsed .sidebar-section-label,.sidebar.collapsed .brand .name,.sidebar.collapsed .uinfo,.sidebar.collapsed .sidebar-logout span,.sidebar.collapsed .sidebar-item .label{opacity:0;width:0;overflow:hidden;white-space:nowrap;display:none}
.sidebar.collapsed .brand{padding:18px 12px 14px;justify-content:center}
.sidebar.collapsed .sidebar-item{padding:9px 0;justify-content:center}
.sidebar.collapsed .sidebar-item .icon{width:auto;margin:0}
.sidebar.collapsed .sidebar-item.on::before{left:0}
.sidebar.collapsed .sidebar-section{padding:0 6px}
.sidebar.collapsed .sidebar-bottom{padding:8px}
.sidebar.collapsed .sidebar-user{justify-content:center;padding:8px}
.sidebar.collapsed .sidebar-logout{justify-content:center;padding:8px}
.sidebar-collapse-btn{display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--line);color:var(--muted);width:28px;height:28px;border-radius:8px;cursor:pointer;transition:all .2s;margin:8px auto 4px;flex-shrink:0}
.sidebar-collapse-btn:hover{background:var(--chip);color:var(--text)}
.topbar{display:flex;align-items:center;gap:8px;padding:0 20px;height:54px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);position:sticky;top:0;z-index:20;flex-shrink:0}
.spacer{flex:1}
.iconbtn{background:var(--chip);border:1px solid var(--line);color:var(--text);border-radius:8px;width:34px;height:34px;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.iconbtn:hover{background:var(--line)}
.syncdot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.syncdot.on{background:var(--green);box-shadow:0 0 0 3px rgba(56,183,117,.18)}
.sidebar-toggle{display:none;background:none;border:none;color:var(--text);font-size:22px;padding:6px;cursor:pointer;line-height:1}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.3)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29}
  .sidebar-overlay.show{display:block}
  .app-main{margin-left:0}
  .sidebar-toggle{display:flex}
  .syncstatus{display:none!important}
}

main{max-width:1280px;margin:0 auto;padding:22px 18px 60px;width:100%}
.crumb{color:var(--muted);font-size:12px;margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.crumb b{color:var(--text)}

/* ===== Cards / Panels ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.kpi .v{font-size:24px;font-weight:800;margin-top:6px;font-family:var(--mono)}
.kpi .v.amber{color:var(--accent)} .kpi .v.green{color:var(--green)} .kpi .v.danger{color:var(--danger)} .kpi .v.cyan{color:var(--accent2)}
.hero-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.kpi-hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;align-items:flex-start;gap:16px}
.kpi-hero .icon-wrap{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-hero .icon-wrap svg{width:24px;height:24px}
.kpi-hero .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:6px}
.kpi-hero .v{font-size:32px;font-weight:800;font-family:var(--mono);line-height:1.1}
.kpi-trend{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;margin-top:6px}
.kpi-trend.up{color:var(--green)} .kpi-trend.down{color:var(--danger)} .kpi-trend.flat{color:var(--muted)}
.kpi-sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;align-items:center;gap:11px}
.kpi-sec .icon-wrap{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-sec .icon-wrap svg{width:17px;height:17px}
.kpi-sec .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.kpi-sec .v{font-size:18px;font-weight:800;font-family:var(--mono);margin-top:2px}
.chart-legend{display:flex;gap:16px;font-size:11.5px}
.chart-legend .dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.bar-pair{display:grid;grid-template-columns:52px 1fr 78px;gap:10px;align-items:center;margin:6px 0;animation:kpiEnter .4s cubic-bezier(.4,0,.2,1) both}
.bar-pair:nth-child(1){animation-delay:.1s} .bar-pair:nth-child(2){animation-delay:.15s} .bar-pair:nth-child(3){animation-delay:.2s}
.bar-pair:nth-child(4){animation-delay:.25s} .bar-pair:nth-child(5){animation-delay:.3s} .bar-pair:nth-child(6){animation-delay:.35s}
.bar-pair:nth-child(7){animation-delay:.4s} .bar-pair:nth-child(8){animation-delay:.45s}
.bar-pair .bars{display:flex;flex-direction:column;gap:3px}
.bar-pair .bar{height:10px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar-pair .bar > div{height:100%;animation:barGrow .8s cubic-bezier(.4,0,.2,1) both;transform-origin:left}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dash-welcome{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;animation:kpiEnter .4s cubic-bezier(.4,0,.2,1) both}
.dash-welcome h1{font-size:24px;font-weight:800;margin:0;line-height:1.2;letter-spacing:-.02em}
.dash-welcome .dash-date{font-size:13px;color:var(--muted);margin-top:3px}
.dash-quick-actions{display:flex;gap:8px;flex-wrap:wrap}
.dash-quick-actions .btn{font-size:12px;padding:7px 16px;border-radius:8px;transition:all .2s}
.dash-quick-actions .btn:hover{transform:translateY(-1px)}
.dash-grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:22px}
@media(max-width:1100px){.dash-grid6{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.dash-grid6{grid-template-columns:repeat(2,1fr)}}
.dash-kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;transition:border-color .2s,box-shadow .25s,transform .2s;animation:kpiEnter .5s cubic-bezier(.4,0,.2,1) both}
.dash-kpi:hover{border-color:color-mix(in srgb,var(--line) 40%,var(--accent2) 30%);box-shadow:0 4px 20px rgba(0,0,0,.2);transform:translateY(-2px)}
.dash-kpi:nth-child(1){animation-delay:.05s} .dash-kpi:nth-child(2){animation-delay:.1s} .dash-kpi:nth-child(3){animation-delay:.15s}
.dash-kpi:nth-child(4){animation-delay:.2s} .dash-kpi:nth-child(5){animation-delay:.25s} .dash-kpi:nth-child(6){animation-delay:.3s}
@keyframes kpiEnter{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.dash-kpi .dk-icon{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.dash-kpi .dk-icon svg{width:18px;height:18px}
.dash-kpi .dk-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px}
.dash-kpi .dk-value{font-size:28px;font-weight:800;font-family:var(--mono);line-height:1.1;letter-spacing:-.02em}
.dash-kpi .dk-sub{font-size:11.5px;color:var(--muted);margin-top:6px}
.dash-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
@media(max-width:900px){.dash-grid3{grid-template-columns:1fr}}
.dash-alert-row{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:6px;margin:-1px -8px;transition:background .15s}
.dash-alert-row:hover{background:var(--chip)}
.dash-alert-row:last-child{border-bottom:none}
.dash-alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.dash-proj-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s}
.dash-proj-card:hover{border-color:var(--accent2);box-shadow:0 4px 16px rgba(0,0,0,.15);transform:translateY(-1px)}
.dash-proj-card .dpc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dash-proj-card .dpc-name{font-weight:700;font-size:13.5px}
.dash-proj-card .dpc-pct{font-family:var(--mono);font-weight:800;font-size:13px}
.dash-cashflow{display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap}
.dash-cashflow .cf-item{flex:1;min-width:120px;text-align:center;padding:16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);transition:border-color .2s,transform .2s}
.dash-cashflow .cf-item:hover{border-color:color-mix(in srgb,var(--line) 50%,var(--accent2) 25%);transform:translateY(-1px)}
.dash-cashflow .cf-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.dash-cashflow .cf-val{font-size:22px;font-weight:800;font-family:var(--mono);letter-spacing:-.02em}
.dash-timeline{position:relative;padding-left:22px}
.dash-timeline::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,var(--accent2),var(--line))}
.dash-tl-item{position:relative;padding:8px 0 12px 0;font-size:13px;transition:background .15s;border-radius:6px;padding-right:6px}
.dash-tl-item:hover{background:var(--chip)}
.dash-tl-item::before{content:'';position:absolute;left:-21px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent2);border:2px solid var(--panel);box-shadow:0 0 0 3px var(--glow-cyan)}
.dash-tl-item.tl-danger::before{background:var(--danger)}
.dash-tl-item.tl-green::before{background:var(--green)}
.dash-tl-item.tl-warn::before{background:var(--warn)}
.dash-tl-item .tl-time{font-size:11px;color:var(--muted);font-family:var(--mono)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;transition:border-color .2s,box-shadow .2s}
.panel:hover{border-color:color-mix(in srgb,var(--line) 50%,var(--accent2) 20%)}
.panel h3{font-size:14px;letter-spacing:.01em;color:var(--text);margin-bottom:14px}
.panel h3.section-label{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.panel .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.panel .ph h3{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}

/* ===== Tables ===== */
.twrap{overflow-x:auto;position:relative}
.twrap::after{content:'';position:absolute;top:0;right:0;bottom:0;width:24px;pointer-events:none;background:linear-gradient(to right,transparent,var(--panel));opacity:0;transition:opacity .2s}
.twrap.scrollable::after{opacity:1}
table{width:100%;border-collapse:collapse;font-size:13.3px}
th{text-align:left;color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
tr.click td{transition:background .1s}
.num{text-align:right;font-family:var(--mono)}
.mono{font-family:var(--mono)}
.mut{color:var(--muted)}
.right{text-align:right}
.center{text-align:center}

/* ===== Badges/Buttons ===== */
.badge{font-size:10.5px;padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.b-INVOICE{background:#15314f;color:#79b8ff}.b-PURCHASE{background:#2b2147;color:#c4a9ff}.b-WORKORDER{background:#173224;color:#7fe0a6}
[data-theme="light"] .b-INVOICE{background:#dceafd;color:#155694}[data-theme="light"] .b-PURCHASE{background:#ece3ff;color:#5b2fbf}[data-theme="light"] .b-WORKORDER{background:#dcf3e3;color:#137a3d}
.b-status{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.b-paid,.b-Paid,.b-Completed,.b-Closed,.b-Delivered{background:#123a26;color:#6fe0a4}
.b-Pending,.b-Ordered,.b-Scheduled{background:#3a2e12;color:#ffcd7a}
.b-danger{background:#3a1414;color:#ff8f8c}
[data-theme="light"] .b-danger{background:#fbdedd;color:#a4302c}
[data-theme="light"] .b-paid,[data-theme="light"] .b-Paid,[data-theme="light"] .b-Completed,[data-theme="light"] .b-Closed,[data-theme="light"] .b-Delivered{background:#dcf3e3;color:#137a3d}
[data-theme="light"] .b-Pending,[data-theme="light"] .b-Ordered,[data-theme="light"] .b-Scheduled{background:#faedd2;color:#8a5c0d}
.lowstock{color:var(--danger);font-weight:800}
.btn{border:none;border-radius:8px;padding:9px 15px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s,filter .15s,border-color .15s,opacity .15s}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.save{background:var(--green);color:#04231a}
.btn.del{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.del:hover{background:rgba(224,82,79,.1)}
.btn.ghost{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line)}
.btn.sm{padding:6px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.x{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:color .15s,background .15s}
.x:hover{color:var(--danger);background:rgba(224,82,79,.1)}

/* ===== Misc ===== */
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{background:var(--input);border:none;color:var(--muted);padding:9px 16px;font-weight:700;font-size:12.5px;transition:background .15s,color .15s}
.toggle button.on{background:var(--accent);color:var(--accent-ink)}
.searchbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.searchbar input,.searchbar select{width:auto;min-width:160px;flex:1}
td,th,.stat-value,.kpi-val,.money{font-variant-numeric:tabular-nums}
.empty{padding:48px 24px;text-align:center;color:var(--muted);position:relative}
.empty::before{content:'';display:block;width:48px;height:48px;margin:0 auto 14px;border-radius:12px;background:var(--chip);border:1px dashed var(--line);opacity:.6}
.empty .big{font-size:32px;margin-bottom:8px}
.empty-titled{font-weight:700;color:var(--text);font-size:13.5px;margin-bottom:4px}
.empty-hint{font-size:12px;color:var(--muted);max-width:260px;margin:0 auto;line-height:1.5}
.toast-container{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none}
.toast{background:#0c2a1f;border:1px solid var(--green);color:#aef5da;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:var(--shadow);transform:translateY(12px);white-space:nowrap}
.toast.show{opacity:1;transform:translateY(0)}
.offline-banner{position:fixed;top:0;left:0;right:0;background:var(--danger,#d33);color:#fff;text-align:center;padding:6px 12px;font-size:13px;font-weight:600;z-index:200;transform:translateY(-100%);transition:transform .3s ease}
.offline-banner.visible{transform:translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:fadeIn .15s ease-out}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:480px;width:100%;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:var(--shadow);animation:slideUp .2s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.modal.wide{max-width:min(95vw, 1000px)}

<script>
/* ============================================================
   CLM General Contractor & Services, Inc. — Construction Management System
   Converted from an Excel/VBA workbook. Local-first (localStorage).

let SEED;
try { SEED = JSON.parse(document.getElementById('seed-data').textContent); }
catch(e) { console.error('Failed to parse seed data:', e); SEED = {}; }
const STORAGE_KEY = 'buildsuite_v1';

let DB = null;
let _dbSnap = null;      // snapshot for change-detection stamping
let session = null;      // {id,name,type}

let sub = {};             // per-view transient state (editing ids, filters, tabs)

async function saveDBAndConfirmSync(){ saveDB(); return { synced: true }; }

/* ---------- local backup & restore ---------- */
let _loginAttempts = {};
const LOGIN_LOCKOUT_MAX = 5;
const LOGIN_LOCKOUT_MINUTES = 15;
function checkLoginLockout(username){
  const key = (username||'').toLowerCase();
  const rec = _loginAttempts[key];
  if(!rec) return { locked: false };
  if(rec.count >= LOGIN_LOCKOUT_MAX){
    const elapsed = (Date.now() - rec.lastAttempt) / 60000;
    if(elapsed < LOGIN_LOCKOUT_MINUTES) return { locked: true, minutes: Math.ceil(LOGIN_LOCKOUT_MINUTES - elapsed) };
    delete _loginAttempts[key];
  }
  return { locked: false };
}
function recordLoginAttempt(username, success){
  const key = (username||'').toLowerCase();
  if(success){ delete _loginAttempts[key]; return; }
  if(!_loginAttempts[key]) _loginAttempts[key] = { count: 0, lastAttempt: 0 };
  _loginAttempts[key].count++;
  _loginAttempts[key].lastAttempt = Date.now();
}
function getStorageUsage(){
  let total = 0;
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    total += (k.length + localStorage.getItem(k).length) * 2;
  }
  return total;
}
function formatBytes(b){
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(2) + ' MB';
}
function exportBackup(){
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `buildsuite-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.setItem('buildsuite_last_backup', new Date().toISOString());
  toast('Backup downloaded');
}
function importBackup(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json';
  inp.onchange = async e => {
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data.users || !data.settings){ toast('Invalid backup file — missing required data'); return; }
      if(!confirm(`Restore from "${file.name}"? This will REPLACE all current data. Make sure you have a backup of your current data first.`)) return;
      DB = data;
      backfillMissingKeys(DB);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      takeSnapshot();
      toast('Data restored from backup — reloading...');
      setTimeout(()=>location.reload(), 1000);
    }catch(err){
      toast('Could not read backup file — make sure it is a valid BuildSuite JSON backup');
    }
  };
  inp.click();
}
function checkAutoBackupReminder(){
  const last = localStorage.getItem('buildsuite_last_backup');
  if(!last) return true;
  const daysSince = (Date.now() - new Date(last).getTime()) / 86400000;
  return daysSince >= 7;
}
function showBackupReminder(){
  if(!checkAutoBackupReminder()) return;
  if(sessionStorage.getItem('buildsuite_backup_dismissed')) return;
  openModal(`

    <div class="btnrow" style="margin-top:16px">

      <button class="btn ghost" onclick="sessionStorage.setItem('buildsuite_backup_dismissed','1');closeModal()">Remind Me Later</button>

  `);

function resetAllData(){
  if(!confirm('DANGER: This will permanently delete ALL data and reset the app to a fresh state. This cannot be undone. Are you absolutely sure?')) return;
  if(!confirm('Last chance — type your admin password to confirm this action, or press Cancel.')) return;
  localStorage.removeItem(STORAGE_KEY);

  localStorage.removeItem('buildsuite_theme');
  localStorage.removeItem('buildsuite_sidebar_collapsed');
  sessionStorage.clear();
  toast('All data cleared — reloading...');
  setTimeout(()=>location.reload(), 800);
}

/* ---------- persistence ---------- */
function backfillMissingKeys(target){
  let migrated = false;
  Object.keys(SEED).forEach(key => {
    if(target[key] === undefined){
      target[key] = JSON.parse(JSON.stringify(SEED[key]));
      migrated = true;
    } else if(Array.isArray(SEED[key]) && !Array.isArray(target[key])){
      target[key] = JSON.parse(JSON.stringify(SEED[key]));
      migrated = true;
    } else if(!Array.isArray(SEED[key]) && typeof SEED[key]==='object' && SEED[key]!==null){
      // plain-object settings: fill in any missing sub-keys without clobbering existing values
      Object.keys(SEED[key]).forEach(sub => {
        if(target[key][sub] === undefined){ target[key][sub] = SEED[key][sub]; migrated = true; }
      });
    }
  });
  return migrated;
}
function loadDB(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try {
      DB = JSON.parse(raw);
      // Migration: if this browser saved data from before a feature (e.g. Fleet) was added,
      // backfill any missing top-level collections/settings from the seed so the app doesn't break.
      const migrated = backfillMissingKeys(DB);
      if(migrated) saveDB();
      return;
    } catch(e){}
  }
  DB = JSON.parse(JSON.stringify(SEED));
  saveDB();
}
function stampChangedRecords(){
  const now = Date.now();
  Object.keys(DB).forEach(key => {
    if(!Array.isArray(DB[key])) return;
    DB[key].forEach(rec => {
      if(!rec || typeof rec !== 'object') return;
      if(!rec._ts){ rec._ts = now; return; }
      if(!_dbSnap) return;
      const snapArr = _dbSnap[key];
      if(!Array.isArray(snapArr)) { rec._ts = now; return; }
      const snapRec = rec.id != null ? snapArr.find(r => r.id === rec.id) : null;
      if(!snapRec){ rec._ts = now; return; }
      const a = Object.assign({}, rec); delete a._ts;
      const b = Object.assign({}, snapRec); delete b._ts;
      if(JSON.stringify(a) !== JSON.stringify(b)) rec._ts = now;
    });
  });
}
function takeSnapshot(){ _dbSnap = JSON.parse(JSON.stringify(DB)); }
function saveDB(){
  stampChangedRecords();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    localStorage.setItem('buildsuite_updated_at', new Date().toISOString());
  }catch(e){
    console.error('saveDB: localStorage write failed', e);
    toast('Storage full — your data may not be saved locally. Try clearing old photos or exporting a backup.');
  }
  takeSnapshot();
}
function resetAll(){
  if(!confirm('Reset all data back to the original sample data? This cannot be undone.')) return;
  localStorage.removeItem(STORAGE_KEY);
  loadDB();
  toast('Data reset');
  render();
}
function openPrepareForResale(){
  if(session.type !== 'Admin'){ toast('Only an Admin can do this.'); return; }
  openModal(`

function validateField(input, rules){
  const val = (input.value||'').trim();
  const wrap = input.closest('.field');
  let err = '';
  for(const r of rules){
    if(r.required && !val) err = r.required;
    else if(r.minLength && val.length < r.minLength) err = `Minimum ${r.minLength} characters`;
    else if(r.maxLength && val.length > r.maxLength) err = `Maximum ${r.maxLength} characters`;
    else if(r.pattern && !r.pattern.test(val)) err = r.message || 'Invalid format';
    else if(r.custom && !r.custom(val)) err = r.message || 'Invalid value';
    if(err) break;
  }
  if(wrap){
    wrap.classList.toggle('field-error', !!err);
    wrap.classList.toggle('field-success', !err && !!val);
    let errEl = wrap.querySelector('.form-error');
    if(err && !errEl){ errEl = document.createElement('div'); errEl.className='form-error'; wrap.appendChild(errEl); }
    if(errEl) errEl.textContent = err;
    if(!err && errEl) errEl.remove();
  }
  return !err;
}

}

/* ---------- computed / lookups ---------- */
function customerById(id){ return DB.customers.find(c=>c.id==id); }
function vendorById(id){ return DB.vendors.find(v=>v.id==id); }
function jobById(id){ return DB.jobs.find(j=>j.id==id); }
function productById(id){ return DB.products.find(p=>p.id==id); }
function employeeById(id){ return DB.employees.find(e=>e.id==id); }
function jobsForCustomer(custId){ return DB.jobs.filter(j=>j.customerId==custId && !j.isAutoJob); }
function partyName(order){
  if(order.type==='PURCHASE'){ const v=vendorById(order.partyId); return v?v.name:order.partyName||'—'; }
  const c=customerById(order.partyId); return c?c.name:order.partyName||'—';
}
function orderTypeLabel(t){ return t==='WORK ORDER' ? 'Work Order' : (t.charAt(0)+t.slice(1).toLowerCase()); }
function orderTypeClass(t){ return 'b-'+t.replace(' ',''); }

function stockFor(prodId){
  let s = 0;
  DB.orders.forEach(o=>{
    o.items.forEach(it=>{
      if(it.prodId != prodId) return;
      if(o.type==='PURCHASE') s += Number(it.qty)||0;
      else if(o.type==='INVOICE') s -= Number(it.qty)||0;
    });
  });
  return s;
}
function valueOnHand(p){ return (Number(p.purchasePrice)||0) * stockFor(p.id); }
function itemCost(item, orderType){
  if(orderType !== 'INVOICE') return 0;
  const p = productById(item.prodId);
  return p ? Number(p.purchasePrice)||0 : 0;
}
function lineTotal(item){ return (Number(item.qty)||0) * (Number(item.price)||0); }
function orderTotal(o){ return (o.items||[]).reduce((s,it)=>s+lineTotal(it),0); }
function orderItemsCost(o){ return (o.items||[]).reduce((s,it)=>s+(itemCost(it,o.type)*(Number(it.qty)||0)),0); }
function orderLaborCost(o){ return (o.laborCosts||[]).reduce((s,l)=>s+(Number(l.totalCost)||0),0); }
function projectReport(customerId, from, to){
  const cust = customerById(customerId);
  if(!cust) return null;
  const jobIds = DB.jobs.filter(j=>j.customerId==customerId).map(j=>j.id);
  const inRange = (d) => !!d && (!from || d>=from) && (!to || d<=to);
  const siteNameLC = cust.name.trim().toLowerCase();

  const invoices = DB.orders.filter(o=>o.type==='INVOICE' && (o.partyId==customerId || jobIds.includes(o.jobId)) && inRange(o.date));
  const revenue = invoices.reduce((s,o)=>s+orderTotal(o),0);
  const cogs = invoices.reduce((s,o)=>s+orderItemsCost(o),0);
  const laborFromOrders = invoices.reduce((s,o)=>s+orderLaborCost(o),0);

  const purchases = DB.orders.filter(o=>o.type==='PURCHASE' && jobIds.includes(o.jobId) && inRange(o.date));
  const purchaseCost = purchases.reduce((s,o)=>s+orderTotal(o),0);

  const txns = DB.transactions.filter(t=>jobIds.includes(t.jobId) && inRange(t.date));
  const txnExpense = txns.filter(t=>t.accountType!=='Income').reduce((s,t)=>s+(Number(t.amount)||0),0);
  const txnIncome = txns.filter(t=>t.accountType==='Income').reduce((s,t)=>s+(Number(t.amount)||0),0);

  const payrollsAtSite = DB.payrolls.filter(p=>(p.site||'').trim().toLowerCase()===siteNameLC && inRange(p.toDate||p.payDate));
  const payrollCost = payrollsAtSite.reduce((s,p)=>s+payrollNet(p),0);

  const vehExpenses = DB.vehicleExpenses.filter(v=>jobIds.includes(v.jobId) && inRange(v.date));
  const vehExp = vehExpenses.reduce((s,v)=>s+(Number(v.amount)||0),0);
  const fuelLogsHere = DB.fuelLogs.filter(f=>jobIds.includes(f.jobId) && inRange(f.date));
  const fuelExp = fuelLogsHere.reduce((s,f)=>s+(Number(f.amount)||0),0);

  const totalExpenses = cogs + laborFromOrders + purchaseCost + txnExpense + payrollCost + vehExp + fuelExp;
  const totalRevenue = revenue + txnIncome;
  const profit = totalRevenue - totalExpenses;

  return {
    cust, from, to, revenue, txnIncome, totalRevenue, cogs, laborFromOrders, purchaseCost, txnExpense,
    payrollCost, vehExp, fuelExp, totalExpenses, profit, invoices, purchases, txns, payrollsAtSite, vehExpenses, fuelLogsHere,
  };
}
function orderProfit(o){
  if(o.type !== 'INVOICE') return null;
  return orderTotal(o) - orderItemsCost(o) - orderLaborCost(o);
}
function taxRateFor(type){
  if(type==='INVOICE') return (DB.settings && DB.settings.salesTaxRate!=null) ? DB.settings.salesTaxRate : 0.08;
  if(type==='PURCHASE') return (DB.settings && DB.settings.poTaxRate!=null) ? DB.settings.poTaxRate : 0.10;
  return 0;
}

/* ---------- password hashing (SHA-256 via Web Crypto) ---------- */
async function hashPassword(plain){
  const enc = new TextEncoder().encode(String(plain));
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function attemptLogin(username, pw){
  const u = DB.users.find(u => (u.username || u.name).toLowerCase() === username.trim().toLowerCase());
  if(!u) return {ok:false, msg:'Please enter a correct user name'};
  const hashedInput = await hashPassword(pw);
  if(String(u.password) !== hashedInput) return {ok:false, msg:'Password has not been entered correctly. Please try again'};
  return {ok:true, user:u};
}

      logNotification('Session', `${session.name} was automatically logged out after 30 minutes of inactivity`, null);

}
function startInactivityWatch(){

function logout(skipConfirm){

/* ---------- role-based permissions ---------- */
// Admin: everything. Manager: everything except managing Users. Sales: limited to sales-facing tabs, no deletes.
// Clerk: same tab access as Manager but cannot delete records.
const SALES_TABS = ['dashboard','orders','products','leads','customers','vendors','calculator','costEstimator','schedule'];
const EMPLOYEE_TABS = ['dashboard','customers','calculator'];
function roleCanAccessTab(tabKey){
  if(!session) return false;
  if(tabKey==='myProfile') return session.type!=='Pending'; // everyone with real access can manage their own profile
  if(tabKey==='help') return session.type!=='Pending';
  if(tabKey==='notificationLog') return session.type!=='Employee' && session.type!=='Pending';
  if(tabKey==='trash') return session.type==='Admin';
  const role = session.type;
  if(role==='Admin') return true;
  if(tabKey==='users') return false;
  if(role==='Manager' || role==='Clerk') return true;
  if(role==='Sales') return SALES_TABS.includes(tabKey) || tabKey==='projectReport' || tabKey==='receivables';
  if(role==='Employee'){
    if(EMPLOYEE_TABS.includes(tabKey) || tabKey==='myProfile') return true;
    if((tabKey==='orders' || tabKey==='inventory') && canRequestForSite()) return true;
    return false;
  }
  if(role==='Custom'){
    const u = DB.users.find(x=>x.id===session.id);
    return !!(u && (u.customTabs||[]).includes(tabKey)) || tabKey==='myProfile';
  }
  return false;
}
function canDelete(){
  return !!session && (session.type==='Admin' || session.type==='Manager');
}
function canEdit(){
  return !!session && session.type!=='Employee' && session.type!=='Pending';
}
function linkedUserRecord(){
  return session ? DB.users.find(u=>u.id===session.id) : null;
}
const SITE_LEAD_POSITIONS = ['Foreman', 'Project Manager', 'Project Engineer'];
function isForemanEmployee(){
  if(!session || session.type!=='Employee') return false;
  const u = linkedUserRecord();
  return !!(u && SITE_LEAD_POSITIONS.includes(u.position));
}
function canRequestForSite(){
  // Foreman, Project Manager, and Project Engineer get this automatically by virtue of their role,
  // but an Admin can also grant it individually to anyone else who actually needs it.
  if(!session || session.type!=='Employee') return false;
  const u = linkedUserRecord();
  return !!(u && (SITE_LEAD_POSITIONS.includes(u.position) || u.canRequestForSite===true));
}
function foremanSite(){
  const u = linkedUserRecord();
  return u ? (u.currentSite||'') : '';
}
const ACTIVITY_COLORS = ['#3fb6c9','#f2a93b','#7c9cf2','#38b775','#e0524f','#c98fe0','#e0a55c','#5cc9b0'];
function activityColor(index){ return ACTIVITY_COLORS[index % ACTIVITY_COLORS.length]; }
function projectActivities(c){
  if(!DB.scheduleActivities) DB.scheduleActivities = [];
  return DB.scheduleActivities.filter(a=>a.projectId===c.id);
}
function projectCompletionPct(c){
  const acts = projectActivities(c);
  if(!acts.length) return 0;
  const totalCost = acts.reduce((s,a)=>s+(Number(a.cost)||0), 0);
  if(!totalCost) return Math.round(acts.reduce((s,a)=>s+scheduleProgressFraction(a)*100, 0) / acts.length);
  return Math.round(acts.reduce((s,a)=>s+((Number(a.cost)||0)/totalCost)*scheduleProgressFraction(a)*100, 0));
}
function canCreateForSite(siteName){
  if(canEdit()) return true;
  if(!canRequestForSite()) return false;
  const mySite = foremanSite();
  return !!mySite && mySite.trim().toLowerCase() === (siteName||'').trim().toLowerCase();
}
function guardDelete(){
  if(canDelete()) return true;
  toast("Your role doesn't have permission to delete records — ask an Admin or Manager.");
  return false;
}

function globalSearchResults(q){

    });
  }
  if(roleCanAccessTab('customers')){
    DB.customers.filter(c=>c.name.toLowerCase().includes(q)).slice(0,6).forEach(c=>{
      results.push({ group:'Projects', label:c.name, sub:c.projectStatus||'', action:()=>go('customers',{custId:c.id}) });
    });
  }
  if(roleCanAccessTab('vendors')){
    DB.vendors.filter(v=>v.name.toLowerCase().includes(q)).slice(0,6).forEach(v=>{
      results.push({ group:'Suppliers', label:v.name, sub:v.category||'', action:()=>go('vendors',{vendId:v.id}) });

      results.push({ group:'Products', label:p.name, sub:p.upc||'', action:()=>go('products',{prodId:p.id}) });
    });
  }
  if(roleCanAccessTab('inventory')){
    const seen = new Set();
    DB.materials.filter(m=>m.name.toLowerCase().includes(q)).forEach(m=>{
      const key = m.name.toLowerCase();
      if(!seen.has(key) && seen.size < 6){ seen.add(key); results.push({ group:'Materials', label:m.name, sub:m.site||'', action:()=>go('inventory',{itab:'materials',matView:'summary'}) }); }
    });
    DB.equipment.filter(eq=>(eq.name||'').toLowerCase().includes(q)).slice(0,6).forEach(eq=>{
      results.push({ group:'Equipment', label:eq.name, sub:eq.status||'', action:()=>go('inventory',{itab:'equipment'}) });
    });
  }
  if(roleCanAccessTab('orders')){
    DB.orders.filter(o=>partyName(o).toLowerCase().includes(q) || String(o.id).includes(q) || (o.jobName||'').toLowerCase().includes(q)).slice(0,6).forEach(o=>{
      results.push({ group:'Orders', label:`#${o.id} — ${partyName(o)}`, sub:orderTypeLabel(o.type), action:()=>go('orders',{editId:o.id}) });

  }

      results.push({ group:'Fleet', label:v.name, sub:v.currentSite||'', action:()=>go('fleet',{vehId:v.id}) });

    DB.users.filter(u=>u.name.toLowerCase().includes(q) || (u.username||'').toLowerCase().includes(q)).slice(0,6).forEach(u=>{
      results.push({ group:'Users', label:u.name, sub:u.type, action:()=>go('users') });
    });
  }
  if(roleCanAccessTab('rfis')){
  }
  return results;
}

const TRASH_TYPE_ARRAYS = {

  siteDiary:'siteDiaries', purchaseRequest:'purchaseRequests', vehicle:'vehicles',

  vendor:'Supplier', order:'Order', transaction:'Transaction', product:'Product', user:'User', payrollRun:'Payroll Run',

function purgeOldTrash(){
  const cutoff = Date.now() - 30*24*60*60*1000;
  const before = DB.trash.length;
  DB.trash = DB.trash.filter(t => new Date(t.deletedAt).getTime() > cutoff);
  return before !== DB.trash.length;
}
function daysLeftInTrash(t){
  const ageMs = Date.now() - new Date(t.deletedAt).getTime();
  return Math.max(0, 30 - Math.floor(ageMs / (24*60*60*1000)));
}
async function restoreFromTrash(trashId){
  if(session.type !== 'Admin'){ toast('Only an Admin can restore items.'); return; }
  const t = DB.trash.find(x=>x.id===trashId);
  if(!t) return;
  if(t.type === 'payrollRun'){
    DB.payrolls.push(t.data.run);
    DB.paidEmployees.push(...t.data.paidEmployees);
  } else if(t.type === 'vehicle'){
    const { expenses, fuelLogs, meterLogs, reminders, ...veh } = t.data;
    DB.vehicles.push(veh);
    if(expenses) DB.vehicleExpenses.push(...expenses);
    if(fuelLogs) DB.fuelLogs.push(...fuelLogs);
    if(meterLogs) DB.meterLogs.push(...meterLogs);
    if(reminders) DB.vehicleReminders.push(...reminders);
  } else {
    const arr = TRASH_TYPE_ARRAYS[t.type];
    if(!arr) return;
    DB[arr].push(t.data);
  }
  DB.trash = DB.trash.filter(x=>x.id!==t.id);
  logNotification('Restore', `${TRASH_TYPE_LABELS[t.type]} "${trashLabel(t)}" restored from Trash`, null);
  renderTrash();
  const r = await saveDBAndConfirmSync();
  toast(r.synced ? 'Restored' : `⚠️ Restored locally, sync pending — ${r.error||'check connection'}`);
}
async function permanentlyDeleteTrash(trashId){
  if(session.type !== 'Admin'){ toast('Only an Admin can permanently delete.'); return; }
  if(!confirm('Permanently delete this? This cannot be undone — not even the Trash can bring it back after this.')) return;
  DB.trash = DB.trash.filter(x=>x.id!==trashId);
  if(!DB._purgedTrashIds) DB._purgedTrashIds = [];
  DB._purgedTrashIds.push(trashId);
  sub.trashSelected && sub.trashSelected.delete(trashId);
  const r = await saveDBAndConfirmSync(); renderTrash();
  toast(r.synced ? 'Permanently deleted' : `⚠️ Deleted locally, sync pending — ${r.error||'check connection'}`);
}

function renderTrash(){
  if(session.type !== 'Admin'){ go('dashboard'); return; }
  purgeOldTrash();
  sub.trashType = sub.trashType || 'ALL';
  if(!sub.trashSelected) sub.trashSelected = new Set();
  let rows = [...DB.trash];
  if(sub.trashType !== 'ALL') rows = rows.filter(t=>t.type===sub.trashType);
  rows.sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));
  const typesPresent = [...new Set(DB.trash.map(t=>t.type))];
  const selCount = sub.trashSelected.size;
  const allChecked = rows.length > 0 && rows.every(t=>sub.trashSelected.has(t.id));
  document.getElementById('mainArea').innerHTML = `
    <div class="crumb">Trash</div>
    <div class="panel">
      <div class="ph"><h3 style="font-size:18px">🗑️ Trash</h3>
        ${rows.length ? `<div class="btnrow" style="margin:0">
          <button class="btn ghost sm" onclick="trashSelectAll()">${allChecked ? 'Deselect All' : 'Select All'}</button>
          ${selCount ? `<button class="btn del sm" onclick="trashDeleteSelected()">Delete Selected (${selCount})</button>
          <button class="btn save sm" onclick="trashRestoreSelected()">Restore Selected (${selCount})</button>` : ''}
        </div>` : ''}
      </div>
      <div class="mut" style="font-size:12.5px;margin-bottom:10px">Deleted items stay here for 30 days before being permanently removed. Only an Admin can restore or permanently delete.</div>

        ${typesPresent.map(t=>`<button class="${sub.trashType===t?'on':''}" onclick="sub.trashType='${t}';sub.trashSelected=new Set();renderTrash()">${TRASH_TYPE_LABELS[t]}</button>`).join('')}
      </div>
      <div class="twrap"><table>
        <tr><th style="width:32px"><input type="checkbox" ${allChecked?'checked':''} onchange="trashSelectAll()"></th><th>Type</th><th>Item</th><th>Deleted By</th><th>Deleted On</th><th>Expires In</th><th></th></tr>
        ${rows.map(t=>`
          <tr>
            <td><input type="checkbox" ${sub.trashSelected.has(t.id)?'checked':''} onchange="trashToggle('${t.id}')"></td>
            <td><span class="badge b-status">${TRASH_TYPE_LABELS[t.type]}</span></td>
            <td><b>${esc(trashLabel(t))}</b></td>
            <td class="mut">${esc(t.deletedBy)}</td>
            <td class="mut">${fmtDate(t.deletedAt.slice(0,10))}</td>
            <td class="mut">${daysLeftInTrash(t)} day${daysLeftInTrash(t)===1?'':'s'}</td>
            <td style="display:flex;gap:6px">
              <button class="btn save sm" onclick="restoreFromTrash('${t.id}')">Restore</button>
              <button class="btn del sm" onclick="permanentlyDeleteTrash('${t.id}')">Delete Forever</button>
            </td>
          </tr>`).join('') || `<tr><td colspan="7" class="empty">Trash is empty</td></tr>`}
      </table></div>
    </div>
  `;
}
function logNotification(type, message, actionView, actionSub){
  DB.notificationLog.unshift({
    id: nextId(DB.notificationLog), type, message,
    date: todayISO(), time: new Date().toISOString(),
    by: (session && session.name) || 'System', read: false,
    actionView: actionView || null, actionSub: actionSub || null,
  });
  if(DB.notificationLog.length > 300) DB.notificationLog.length = 300; // keep this from growing forever
  saveDB();
}
function markLogRead(id){
  const n = DB.notificationLog.find(x=>x.id===id);
  if(n){ n.read = true; saveDB(); }
}
function markAllLogRead(){
  DB.notificationLog.forEach(n=>n.read=true);
  saveDB(); renderNotificationLog();
}
function getAlerts(){
  const alerts = [];
  DB.vehicleReminders.forEach(r=>{
    const info = reminderStatusInfo(r);
    if(info.label==='Overdue'){ const v=vehicleById(r.vehicleId); alerts.push({ type:'Fleet', label:`${v?v.name:'Vehicle'} — ${r.name} overdue`, action:()=>go('fleet',{vehId:r.vehicleId,vtab:'reminders'}) }); }
  });
  DB.equipmentReminders.forEach(r=>{
    const info = reminderStatusInfo(r);
    if(info.label==='Overdue'){ alerts.push({ type:'Equipment', label:`${r.toolName} — ${r.name} overdue`, action:()=>{go('inventory',{itab:'equipment'});openToolHistory(r.toolName);} }); }
  });
  DB.products.forEach(p=>{
    const s = stockFor(p.id);
    if(s < 5){ alerts.push({ type:'Stock', label:`${p.name} low stock (${s})`, action:()=>go('products') }); }
  });
  DB.vendors.forEach(v=>{
    const status = pcabStatus(v);
    if(status && (status.label==='Expired' || status.label==='Expiring Soon')){ alerts.push({ type:'License', label:`${v.name} PCAB license ${status.label.toLowerCase()}`, action:()=>editVendor(v.id) }); }
  });
  DB.employees.forEach(e=>{
    const lic = employeeLicenseStatus(e);
    if(lic && (lic.label==='Expired' || lic.label==='Expiring Soon')){ alerts.push({ type:'License', label:`${e.name} — ${e.licenseType||'license'} ${lic.label.toLowerCase()}`, action:()=>go('employees',{empId:e.id}) }); }
  });
  const pendingReqs = DB.purchaseRequests.filter(r=>r.status==='Pending');
  pendingReqs.forEach(r=>{ alerts.push({ type:'Request', label:`${r.site} purchase request pending approval`, action:()=>go('inventory',{itab:'requests'}) }); });
  lowStockMaterials().forEach(g=>{ alerts.push({ type:'Low Stock', label:`${g.name} — ${g.qty} left (reorder at ${g.reorderPoint})`, action:()=>go('inventory',{itab:'materials',matView:'summary'}) }); });
  DB.cashAdvances.filter(a=>a.status==='Outstanding').forEach(a=>{ alerts.push({ type:'Advance', label:`${a.employeeName} owes ${money(a.amount)} (cash advance)`, action:()=>{ const emp=employeeById(a.employeeId); if(emp) go('employees',{empId:emp.id,tab:'advances'}); } }); });
  if(session && session.type==='Admin'){
    DB.users.filter(u=>u.type==='Pending').forEach(u=>{
      const label = u.autoMatched ? `${u.name} signed up and matched an existing employee record — review and approve` : `${u.name} signed up and is waiting for approval`;
      alerts.push({ type: u.autoMatched?'Name Match':'New Account', label, action:()=>go('users') });
    });
    DB.users.filter(u=>u.reviewed===false && u.type!=='Pending').forEach(u=>{
      alerts.push({ type:'Review', label:`${u.name} (${u.type}) is worth a second look`, action:()=>go('users') });
    });
  }
  accountsReceivable().filter(r=>r.daysOutstanding>30).forEach(r=>{ alerts.push({ type:'Overdue Invoice', label:`#${r.order.id} ${partyName(r.order)} — ${r.daysOutstanding}d overdue`, action:()=>go('orders',{editId:r.order.id}) }); });
  return alerts;
}
function toggleNotifications(){
  const existing = document.getElementById('notifPanel');
  if(existing){ existing.remove(); return; }
  const alerts = getAlerts();
  const panel = document.createElement('div');
  panel.id = 'notifPanel';
  panel.style.cssText = 'position:fixed;top:60px;right:16px;width:360px;max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:45;padding:14px';
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <b style="font-size:14px">Notifications</b><button class="x" aria-label="Close" onclick="document.getElementById('notifPanel').remove()">✕</button>
    </div>
    ${alerts.length ? alerts.map((a,i)=>`
      <div class="stat-row" style="cursor:pointer" onclick="document.getElementById('notifPanel').remove();window.__notifAction${i}()">
        <span style="font-size:12.5px"><span class="badge b-status" style="margin-right:6px">${esc(a.type)}</span>${esc(a.label)}</span>
      </div>
    `).join('') : `<div class="empty">You're all caught up 👍</div>`}
  `;
  document.body.appendChild(panel);
  alerts.forEach((a,i)=>{ window['__notifAction'+i] = a.action; });
  setTimeout(()=>{
    document.addEventListener('click', function closeOnce(e){
      if(!panel.contains(e.target) && e.target.title!=='Notifications'){ panel.remove(); document.removeEventListener('click', closeOnce); }
    });
  }, 10);
}

function openModal(html, opts){
  const existing = document.getElementById('modalBg');
  if(existing) existing.remove();
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.id = 'modalBg';
  const wideClass = (opts && opts.wide) ? ' wide' : '';
  bg.innerHTML = `<div class="modal${wideClass}">${html}</div>`;
  bg.addEventListener('mousedown', e=>{ if(e.target===bg) closeModal(); });
  document.body.appendChild(bg);
}

  const bg = document.getElementById('modalBg');
  if(bg) bg.remove();
}

async function pushSheetTab(url, sheetName, headers, rows){
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // avoids a CORS preflight against Apps Script
    body: JSON.stringify({ sheetName, headers, rows }),
  });
  return res.ok || res.status === 0; // Apps Script sometimes returns an opaque response; treat as success if no network error was thrown
}
async function syncToGoogleSheets(){
  const url = (DB.settings.sheetsWebhookUrl || '').trim();
  if(!url){ toast('Paste your Apps Script Web App URL first'); return; }
  toast('Syncing to Google Sheets...');
  try{
    await pushSheetTab(url, 'Materials',
      ['Name','Total Qty','Unit','Site(s)','Est. Value'],
      materialGroups().map(g=>[g.name, g.qty, g.unit, '', g.value])
    );
    await pushSheetTab(url, 'Employees',
      ['Name','Position','Pay Type','Rate','Phone','Active'],
      DB.employees.map(e=>[e.name, e.type, e.payType, e.regAmount, e.phone, e.active?'Yes':'No'])
    );
    await pushSheetTab(url, 'Suppliers',
      ['Name','Classification','Item','Contact Person','Phone','City'],
      DB.vendors.map(v=>[v.name, v.classification, v.item, v.contactPerson, v.phone, v.city])
    );
    await pushSheetTab(url, 'Tools & Equipment',
      ['Name','Brand','Serial #','Qty','Unit','Status','Current Site'],
      DB.equipment.map(e=>[e.name, e.brand, e.serial, e.qty, e.unit, e.status, e.site])
    );
    toast('Synced to Google Sheets successfully');
  }catch(e){
    toast('Could not reach Google Sheets — double check the URL and that it\'s deployed correctly.');
  }
}

function uploadGalleryPhotos(fileList){
  const MAX_SIZE = 2*1024*1024;
  [...fileList].forEach(file=>{
    if(!file.type.startsWith('image/')){ toast(`Skipped ${file.name} — not an image`); return; }
    if(file.size > MAX_SIZE){ toast(`Skipped ${file.name} — over 2MB`); return; }
    const reader = new FileReader();
    reader.onload = () => {
      DB.galleryPhotos.push({ id: nextId(DB.galleryPhotos), url: reader.result, caption: '', date: todayISO() });
      try{ saveDB(); }catch(err){ DB.galleryPhotos.pop(); toast('Storage is full — try fewer or smaller photos.'); return; }
      openManageGallery();
    };
    reader.readAsDataURL(file);
  });
}

async function doSignup(){
  const firstName = document.getElementById('suFirstName').value.trim();
  const middleName = document.getElementById('suMiddleName').value.trim();
  const lastName = document.getElementById('suLastName').value.trim();
  const name = [firstName, middleName, lastName].filter(Boolean).join(' ');
  let username = document.getElementById('suUsername').value.trim();
  const pw = document.getElementById('suPw').value;
  const pw2 = document.getElementById('suPw2').value;
  const code = document.getElementById('suCode').value.trim();
  let position = document.getElementById('suPosition').value;
  const email = document.getElementById('suEmail').value.trim();
  const phone = document.getElementById('suPhone').value.trim();
  const address = document.getElementById('suAddress').value.trim();
  const err = document.getElementById('loginErr');
  if(!firstName || !lastName){ err.textContent = 'Please enter at least your first and last name'; return; }
  if(!username){ username = (firstName[0] + lastName).toLowerCase().replace(/\s+/g,''); } // sensible default if left blank, e.g. "jdelacruz"
  if(DB.users.some(u=>(u.username||u.name).toLowerCase()===username.toLowerCase())){ err.textContent = `Username "${username}" is already taken — try a different one`; return; }
  if(DB.users.some(u=>u.name.toLowerCase()===name.toLowerCase())){ err.textContent = 'Someone with that exact name already has an account — try adding your middle name or sign in instead'; return; }
  if(pw.length < 8){ err.textContent = 'Password must be at least 8 characters'; return; }
  if(!/[A-Z]/.test(pw)){ err.textContent = 'Password must include at least one uppercase letter'; return; }
  if(!/[0-9]/.test(pw)){ err.textContent = 'Password must include at least one number'; return; }
  if(!/[^A-Za-z0-9]/.test(pw)){ err.textContent = 'Password must include at least one special character'; return; }
  if(pw !== pw2){ err.textContent = "Passwords don't match"; return; }
  const requiredCode = (DB.settings && DB.settings.signupCode) || '';
  if(requiredCode && code !== requiredCode){ err.textContent = 'Invite code is incorrect — ask your Admin for the current one'; return; }

  // Auto-match against the existing employee roster by name, so returning workers link up automatically.
  const matchedEmployee = DB.employees.find(e=>(e.name||'').trim().toLowerCase()===name.toLowerCase());
  let autoMatched = false, matchedEmployeeId = null;
  if(matchedEmployee){
    autoMatched = true;
    matchedEmployeeId = matchedEmployee.id;
    position = matchedEmployee.type || position; // trust the existing HR record over the dropdown they picked
  } else {
    // No existing HR record — create one automatically so this person shows up in Employees too.
    const newEmployee = {
      id: nextId(DB.employees), name, type: position || 'Laborer', payType: TYPE_DEFAULT_PAYTYPE[position] || 'Daily',
      regAmount: 0, otRate: 0, hourlyCost: 0, phone, email, address, city: '', state: '', zip: '',
      active: true, govDeductions: false, sssNo: '', philhealthNo: '', pagibigNo: '',
      licenseType: '', licenseNumber: '', licenseExpiry: '', foremanName: '',
    };
    DB.employees.push(newEmployee);
    matchedEmployeeId = newEmployee.id;
  }

  const hashedPw = await hashPassword(pw);
  const newUser = {
    id: nextId(DB.users), name, username, firstName, middleName, lastName, password: hashedPw, type: 'Pending', position, email, phone, address,
    currentSite: '', foremanId: null, foremanName: '', joinedDate: todayISO(), reviewed: false, autoMatched, matchedEmployeeId, credentialsGiven: true, authMigrated: false, authUserId: null,
  };
  DB.users.push(newUser);
  logNotification(autoMatched ? 'Name Match' : 'New Account', `${name} created an account${autoMatched?' — matched existing employee record':''}`, 'users');
  saveDB();
  session = { id: newUser.id, name: newUser.name, type: newUser.type };
  sessionStorage.setItem('buildsuite_session', JSON.stringify(session));
  toast(`Account created! Your username is "${username}" — waiting for an Admin to approve you`);
  enterApp();
}
async function doLogin(){
  const uInput = document.getElementById('loginUser').value;
  const p = document.getElementById('loginPw').value;
  const btn = document.querySelector('.loginCard button.btn.pri');
  if(btn){ btn.disabled = true; btn.textContent = 'Checking...'; }
  const lockout = checkLoginLockout(uInput);
  if(lockout.locked){
    document.getElementById('loginErr').textContent = `Too many failed attempts. Try again in ${lockout.minutes} minute${lockout.minutes>1?'s':''}.`;
    if(btn){ btn.disabled = false; btn.textContent = 'Sign in'; }
    return;
  }

  const res = await attemptLogin(uInput, p);
  if(!res.ok){
    recordLoginAttempt(uInput, false);
    if(btn){ btn.disabled = false; btn.textContent = 'Sign in'; }
    document.getElementById('loginErr').textContent = res.msg;
    return;
  }
  recordLoginAttempt(uInput, true);

  if(btn){ btn.disabled = false; btn.textContent = 'Sign in'; }
  session = { id: res.user.id, name: res.user.name, type: res.user.type };
  sessionStorage.setItem('buildsuite_session', JSON.stringify(session));
  enterApp();
}

function kpiTrend(current, previous){
  if(!previous) return { label: 'No prior data', cls: 'flat', arrow: '' };
  const pct = ((current - previous) / previous) * 100;
  if(Math.abs(pct) < 1) return { label: 'Flat vs last month', cls: 'flat', arrow: '→' };
  return { label: `${Math.abs(pct).toFixed(0)}% vs last month`, cls: pct > 0 ? 'up' : 'down', arrow: pct > 0 ? '↑' : '↓' };
}

function drawRevenueChart(canvasId, months, revData, expData, fmtMonth){
  const c = document.getElementById(canvasId);
  if(!c) return;
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();
  c.width = rect.width * dpr; c.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = {top:20,right:16,bottom:34,left:58};
  const cW = W-pad.left-pad.right, cH = H-pad.top-pad.bottom;
  if(!months.length) return;
  const allVals = months.flatMap(m=>[revData[m]||0,expData[m]||0]);
  const maxV = Math.max(1,...allVals);
  const isDark = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().startsWith('#0') || getComputedStyle(document.documentElement).getPropertyValue('--bg').trim().startsWith('#1');
  const gridColor = isDark ? 'rgba(255,255,255,.06)' : 'rgba(0,0,0,.06)';
  const textColor = isDark ? 'rgba(255,255,255,.45)' : 'rgba(0,0,0,.45)';
  ctx.font = '11px -apple-system,sans-serif';
  const gridLines = 4;
  for(let i=0;i<=gridLines;i++){
    const y = pad.top + (cH/gridLines)*i;
    ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    const val = maxV - (maxV/gridLines)*i;
    ctx.fillStyle = textColor; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(val>=1000?'₱'+Math.round(val/1000)+'k':'₱'+Math.round(val), pad.left-8, y);
  }
  const barW = Math.min(24, (cW/months.length-8)/2);
  const gap = 3;
  const animProgress = {v:0};
  function animate(){
    animProgress.v = Math.min(1, animProgress.v + 0.035);
    const ease = 1-Math.pow(1-animProgress.v,3);
    ctx.clearRect(pad.left,pad.top-1,cW+1,cH+2);
    for(let i=0;i<=gridLines;i++){
      const y = pad.top + (cH/gridLines)*i;
      ctx.strokeStyle = gridColor; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(W-pad.right,y); ctx.stroke();
    }
    months.forEach((m,i)=>{
      const x = pad.left + (cW/months.length)*i + (cW/months.length)/2;
      const rv = (revData[m]||0)/maxV*cH*ease;
      const ev = (expData[m]||0)/maxV*cH*ease;
      const revGrad = ctx.createLinearGradient(0,pad.top+cH-rv,0,pad.top+cH);
      revGrad.addColorStop(0, isDark?'rgba(52,211,153,.9)':'rgba(30,138,82,.9)');
      revGrad.addColorStop(1, isDark?'rgba(52,211,153,.4)':'rgba(30,138,82,.4)');
      ctx.fillStyle = revGrad;
      roundRect(ctx, x-barW-gap/2, pad.top+cH-rv, barW, rv, 3);
      const expGrad = ctx.createLinearGradient(0,pad.top+cH-ev,0,pad.top+cH);
      expGrad.addColorStop(0, isDark?'rgba(240,99,96,.9)':'rgba(193,64,60,.9)');
      expGrad.addColorStop(1, isDark?'rgba(240,99,96,.4)':'rgba(193,64,60,.4)');
      ctx.fillStyle = expGrad;
      roundRect(ctx, x+gap/2, pad.top+cH-ev, barW, ev, 3);
      ctx.fillStyle = textColor; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(fmtMonth(m), x, pad.top+cH+10);
    });
    if(animProgress.v < 1) requestAnimationFrame(animate);
  }
  animate();
}
function roundRect(ctx,x,y,w,h,r){
  if(h<1) return;
  r = Math.min(r,h/2,w/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.fill();
}

            <div class="stat-row"><span class="mut">Revenue</span><span class="mono">${money(totalRevenue)}</span></div>

        `;
      })()}
    </div>

    <div class="panel" id="dashDetailSection">
      <div class="ph"><h3>Project Details & Schedule</h3></div>
      <div class="field" style="margin-bottom:14px">
        <label class="fl">Select a Project</label>
        <select id="dashProjectSelect" onchange="sub.dashProjectId=Number(this.value);renderDashboard()">
          <option value="">-- choose a project --</option>
          ${[...DB.customers].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}" ${sub.dashProjectId==c.id?'selected':''}>${esc(c.name)} ${c.projectStatus==='Active'?'(Active)':c.projectStatus==='Completed'?'(Completed)':''}</option>`).join('')}
        </select>
      </div>
    </div>
    ${(() => {
      const pid = sub.dashProjectId;
      if(!pid) return '';
      const proj = DB.customers.find(c=>c.id===pid);
      if(!proj) return '';
      if(!DB.scheduleActivities) DB.scheduleActivities = [];
      const rows = DB.scheduleActivities.filter(a=>a.projectId===pid);
      const totalCost = rows.reduce((s,a)=>s+(Number(a.cost)||0),0);
      const completedActs = rows.filter(a=>a.status==='Completed');
      const delayedActs = rows.filter(a=>a.status==='Delayed');
      const inProgressActs = rows.filter(a=>a.status==='In Progress');
      const pctComplete = totalCost ? rows.reduce((s,a)=>s+((Number(a.cost)||0)/totalCost)*scheduleProgressFraction(a)*100,0) : 0;

      const allDates = rows.flatMap(a=>[a.plannedStart,a.plannedEnd,a.actualStart,a.actualEnd].filter(Boolean));
      const minD = allDates.length ? new Date(Math.min(...allDates.map(d=>new Date(d).getTime()))) : new Date();
      const maxD = allDates.length ? new Date(Math.max(...allDates.map(d=>new Date(d).getTime()))) : new Date();
      const today = new Date();
      const spanDays = Math.max(1, scheduleDaysBetween(minD, maxD));

      const plannedDurDays = rows.length ? scheduleDaysBetween(
        new Date(Math.min(...rows.filter(a=>a.plannedStart).map(a=>new Date(a.plannedStart).getTime()))),
        new Date(Math.max(...rows.filter(a=>a.plannedEnd).map(a=>new Date(a.plannedEnd).getTime())))
      ) : 0;
      const actualDates = rows.filter(a=>a.actualStart);
      const actualDurDays = actualDates.length ? scheduleDaysBetween(
        new Date(Math.min(...actualDates.map(a=>new Date(a.actualStart).getTime()))),
        new Date(Math.max(...actualDates.filter(a=>a.actualEnd).map(a=>new Date(a.actualEnd).getTime())).valueOf() || today.getTime())
      ) : 0;
      const schedVariance = plannedDurDays - actualDurDays;

      const todayPct = Math.max(0, Math.min(100, scheduleDaysBetween(minD, today) / spanDays * 100));

      const monthLabels = [];
      if(rows.length){
        const ml = new Date(minD.getFullYear(), minD.getMonth(), 1);
        while(ml <= maxD){ monthLabels.push({label:ml.toLocaleString(undefined,{month:'short',year:'2-digit'}), pct: Math.max(0, scheduleDaysBetween(minD, ml)/spanDays*100)}); ml.setMonth(ml.getMonth()+1); }
      }

      return `
      <div class="panel" style="border:2px solid var(--accent);border-radius:var(--r)">
        <div class="ph"><h3>${esc(proj.name)} — Project Details</h3>
          <div style="display:flex;gap:6px">
            <button class="btn ghost sm" onclick="go('customers',{custId:${pid}})">Open Project</button>
            <button class="btn ghost sm" onclick="go('schedule')">Full Schedule</button>
          </div>
        </div>
        <div class="cards" style="margin-bottom:16px">
          <div class="kpi"><div class="l">Total Cost</div><div class="v cyan">${money0(totalCost)}</div></div>
          <div class="kpi"><div class="l">Completion</div><div class="v ${pctComplete>=100?'green':pctComplete>=50?'amber':'danger'}">${pctComplete.toFixed(1)}%</div></div>
          <div class="kpi"><div class="l">Planned Duration</div><div class="v">${plannedDurDays}d</div></div>
          <div class="kpi"><div class="l">Schedule Variance</div><div class="v ${schedVariance>=0?'green':'danger'}">${schedVariance>=0?'+':''}${schedVariance}d</div></div>
          <div class="kpi"><div class="l">Activities</div><div class="v">${rows.length}</div></div>
          <div class="kpi"><div class="l">Completed</div><div class="v green">${completedActs.length}</div></div>
          <div class="kpi"><div class="l">In Progress</div><div class="v amber">${inProgressActs.length}</div></div>
          <div class="kpi"><div class="l">Delayed</div><div class="v ${delayedActs.length?'danger':'green'}">${delayedActs.length}</div></div>
        </div>

        ${rows.length ? `
        <h3 style="margin-bottom:10px">GANTT CHART</h3>
        <div style="overflow-x:auto;margin-bottom:20px">
          <div style="position:relative;min-width:700px">
            <div style="display:flex;border-bottom:1px solid var(--line);padding:0 0 4px 180px;margin-bottom:2px;position:relative">
              ${monthLabels.map(m=>`<span class="mut" style="position:absolute;left:calc(180px + (100% - 180px) * ${m.pct} / 100);font-size:10px;font-weight:700;text-transform:uppercase">${m.label}</span>`).join('')}
              &nbsp;
            </div>
            ${todayPct>0&&todayPct<100?`<div style="position:absolute;left:calc(180px + (100% - 180px) * ${todayPct.toFixed(2)} / 100);top:20px;bottom:0;width:2px;background:var(--danger);opacity:.5;z-index:2"><span style="position:absolute;top:-14px;left:-12px;font-size:9px;font-weight:800;color:var(--danger)">TODAY</span></div>`:''}
            ${rows.map((a,i)=>{
              const ps = a.plannedStart ? scheduleDaysBetween(minD, new Date(a.plannedStart))/spanDays*100 : 0;
              const pw = a.plannedStart&&a.plannedEnd ? Math.max(1, scheduleDaysBetween(new Date(a.plannedStart), new Date(a.plannedEnd))/spanDays*100) : 0;
              const hasActual = a.actualStart;
              const as = hasActual ? scheduleDaysBetween(minD, new Date(a.actualStart))/spanDays*100 : 0;
              const ae = a.actualEnd ? new Date(a.actualEnd) : (hasActual ? today : null);
              const aw = hasActual && ae ? Math.max(0.5, scheduleDaysBetween(new Date(a.actualStart), ae)/spanDays*100) : 0;
              const isDelayed = a.status==='Delayed' || (a.actualEnd && a.plannedEnd && a.actualEnd > a.plannedEnd);
              const actualColor = isDelayed ? 'var(--danger)' : 'var(--green)';
              return `
              <div style="display:flex;align-items:center;height:28px;margin:1px 0">
                <div style="width:180px;flex-shrink:0;font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px" title="${esc(a.name)}">${i+1}. ${esc(a.name)}</div>
                <div style="flex:1;position:relative;height:100%">
                  <div style="position:absolute;top:2px;left:${ps.toFixed(2)}%;width:${pw.toFixed(2)}%;height:10px;background:var(--accent2);border-radius:3px;opacity:.5" title="Planned: ${a.plannedStart||'?'} to ${a.plannedEnd||'?'}"></div>
                  ${hasActual?`<div style="position:absolute;top:14px;left:${as.toFixed(2)}%;width:${aw.toFixed(2)}%;height:10px;background:${actualColor};border-radius:3px" title="Actual: ${a.actualStart||'?'} to ${a.actualEnd||'ongoing'}"></div>`:''}
                </div>
              </div>`;
            }).join('')}
            <div style="display:flex;gap:16px;padding:10px 0 0 180px;font-size:11px">
              <span style="display:flex;align-items:center;gap:4px"><span style="width:20px;height:8px;border-radius:2px;background:var(--accent2);opacity:.5"></span>Planned</span>
              <span style="display:flex;align-items:center;gap:4px"><span style="width:20px;height:8px;border-radius:2px;background:var(--green)"></span>Actual (on time)</span>
              <span style="display:flex;align-items:center;gap:4px"><span style="width:20px;height:8px;border-radius:2px;background:var(--danger)"></span>Actual (delayed)</span>
            </div>
          </div>
        </div>

        <h3 style="margin-bottom:10px">S-CURVE (Planned vs Actual Progress)</h3>
        <canvas id="dashSCurve" width="800" height="320" style="width:100%;max-width:800px;height:auto"></canvas>
        ` : `<div class="empty" style="padding:24px">No schedule activities for this project yet. <a style="color:var(--accent2);cursor:pointer" onclick="go('schedule')">Go to Schedule</a> to add activities.</div>`}

        ${rows.length ? `
        <h3 style="margin:18px 0 10px">ACTIVITY LIST</h3>
        <div class="twrap"><table>
          <tr><th>#</th><th>Activity</th><th>Cost</th><th>Weight</th><th>Planned</th><th>Actual</th><th>Status</th></tr>
          ${rows.map((a,i)=>{
            const weight = totalCost ? ((Number(a.cost)||0)/totalCost*100).toFixed(1)+'%' : '—';
            return `<tr>
              <td class="mono">${i+1}</td>
              <td><b>${esc(a.name)}</b></td>
              <td class="num">${money0(Number(a.cost)||0)}</td>
              <td class="num mut">${weight}</td>
              <td class="mut" style="font-size:11.5px">${a.plannedStart?fmtDate(a.plannedStart):''} — ${a.plannedEnd?fmtDate(a.plannedEnd):''}</td>
              <td class="mut" style="font-size:11.5px">${a.actualStart?fmtDate(a.actualStart):'—'} — ${a.actualEnd?fmtDate(a.actualEnd):'ongoing'}</td>
              <td><span class="badge ${scheduleStatusBadgeClass(a.status)}">${esc(a.status)}</span></td>
            </tr>`;
          }).join('')}
        </table></div>
        ` : ''}
      </div>`;
    })()}
  `;
  if(sub.dashProjectId){
    const _rows = DB.scheduleActivities.filter(a=>String(a.projectId)===String(sub.dashProjectId));
    if(_rows.length){
      setTimeout(()=>{
        const dates = _rows.flatMap(a=>[a.plannedStart,a.plannedEnd,a.actualStart,a.actualEnd].filter(Boolean)).map(d=>new Date(d));
        if(!dates.length) return;
        const minD = new Date(Math.min(...dates));
        const maxD = new Date(Math.max(...dates.map(d=>d.getTime()), Date.now()));
        const series = scheduleBuildSeries(_rows, minD, maxD);
        drawScheduleSCurve(series, minD, maxD, new Date(), 'dashSCurve');
      }, 60);
    }
  }
  if(months.length){
    requestAnimationFrame(()=>drawRevenueChart('revExpCanvas', months, byMonth, expByMonth, fmtMonth));
  }
}
function renderReceivables(){

  const over60 = ar.filter(r=>r.daysOutstanding>60 && r.daysOutstanding<=90);
  const over90 = ar.filter(r=>r.daysOutstanding>90);
  const sumBal = arr => arr.reduce((s,r)=>s+r.balance,0);
  document.getElementById('mainArea').innerHTML = `
    <div class="crumb"><a onclick="go('dashboard')" style="color:var(--muted);text-decoration:none">Dashboard</a> &nbsp;/&nbsp; <b>Accounts Receivable</b></div>
    <div class="cards">
      <div class="kpi"><div class="l">Total Outstanding</div><div class="v danger">${money0(total)}</div></div>
      <div class="kpi"><div class="l">Open Invoices</div><div class="v">${ar.length}</div></div>
      <div class="kpi"><div class="l">Current (0-30d)</div><div class="v green">${money0(sumBal(cur))}</div></div>
      <div class="kpi"><div class="l">31-60 Days</div><div class="v ${over30.length?'amber':'green'}">${money0(sumBal(over30))}</div></div>
      <div class="kpi"><div class="l">61-90 Days</div><div class="v ${over60.length?'danger':'green'}">${money0(sumBal(over60))}</div></div>
      <div class="kpi"><div class="l">90+ Days</div><div class="v ${over90.length?'danger':'green'}">${money0(sumBal(over90))}</div></div>
    </div>
    <div class="panel">
      <div class="ph"><h3>Outstanding Invoices</h3><button class="btn ghost sm" onclick="exportReceivablesCSV()">📥 CSV</button></div>
      <div class="twrap"><table>
        <tr><th>#</th><th>Customer / Project</th><th>Date</th><th>Status</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Balance</th><th class="right">Days</th></tr>
        ${ar.map(r=>`
          <tr class="click" onclick="go('orders',{editId:${r.order.id}})">
            <td class="mono">${r.order.id}</td>
            <td>${esc(partyName(r.order))}</td>
            <td class="mut">${fmtDate(r.order.date)}</td>
            <td><span class="badge b-status b-${esc(r.order.status)}">${esc(r.order.status)}</span></td>
            <td class="num">${money(r.total)}</td>
            <td class="num mut">${money(r.paid)}</td>
            <td class="num mono" style="font-weight:800">${money(r.balance)}</td>
            <td class="num ${r.daysOutstanding>30?'lowstock':''}">${r.daysOutstanding}</td>
          </tr>`).join('') || `<tr><td colspan="8" class="empty">No outstanding invoices</td></tr>`}
      </table></div>
    </div>
  `;

function exportReceivablesCSV(){
  const ar = accountsReceivable();
  const headers = ['Invoice #','Customer','Date','Status','Total','Paid','Balance','Days Outstanding'];
  const rows = ar.map(r=>[r.order.id, partyName(r.order), r.order.date||'', r.order.status||'', r.total.toFixed(2), r.paid.toFixed(2), r.balance.toFixed(2), r.daysOutstanding]);
  downloadCSV(`Receivables_${todayISO()}.csv`, headers, rows);
}
function viewProjectReport(){
  const id = document.getElementById('dashProjSelect').value;
  if(!id){ toast('Please select a project first'); return; }
  const from = document.getElementById('dashProjFrom').value;
  const to = document.getElementById('dashProjTo').value;
  go('projectReport', { projectId: Number(id), from, to });
}
function clearProjectBudget(projectId){
  if(!canEdit()) return;
  if(!confirm('Remove the approved budget for this project?')) return;
  const c = customerById(projectId);
  if(c){ c.budget = ''; saveDB(); toast('Budget cleared'); go('projectReport',{projectId,from:sub.from||'',to:sub.to||todayISO()}); }
}

    <div class="crumb"><a onclick="go('dashboard')" style="color:var(--muted);text-decoration:none">Dashboard</a> &nbsp;/&nbsp; <b>${esc(r.cust.name)} Report</b></div>
    <div class="panel">

        ['Other Transactions', r.txnExpense, '#999'],
      ].filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);

      const max = Math.max(...cats.map(c=>c[1]));
      return `
    <div class="panel">
      <h3>Expense Breakdown</h3>
      <div class="mut" style="font-size:12px;margin-bottom:12px">Where this project's ${money0(r.totalExpenses)} in spending actually went.</div>

        note = `Spending is ${gap}pts ahead of physical progress — worth a closer look.`; noteColor = 'var(--danger)';
      } else if(gap < -15){
        note = `Physical progress is ${-gap}pts ahead of spending — good sign.`; noteColor = 'var(--green)';

      </div>
      <div class="mut" style="font-size:11.5px;margin-top:8px;color:${noteColor}">${note}</div>
    </div>`;
